name: Assemble STEPBACK STUDIO v4.1 complete HTML

on:
  push:
    branches: [main]
    paths:
      - "build_full_index.py"
      - ".github/workflows/assemble.yml"
      - "assets/stepback-v4.1/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site source
        uses: actions/checkout@v4
      - name: Assemble exact full HTML
        run: python3 build_full_index.py
      - name: Commit self-contained page
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Full HTML already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish single-file STEPBACK STUDIO v4.1 (no chunk loading)"
          git push

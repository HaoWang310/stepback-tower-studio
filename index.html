<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0a0b0e"><title>STEPBACK STUDIO v4.1</title>
<style>html,body{height:100%;margin:0;background:#080a0d;color:#dce4ee;font:13px -apple-system,BlinkMacSystemFont,sans-serif;}main{height:100%;display:grid;place-items:center}.panel{text-align:center}.sub{color:#8895a5;margin-top:12px;font-size:12px}</style></head>
<body><main id="loading-boot"><div class="panel"><div style="font-size:20px;letter-spacing:.12em">STEPBACK STUDIO</div><div class="sub" id="status">正在加载建筑模型与三维工作室 v4.1…</div></div></main>
<script>
(async function () {
 const n=9;
 const paths=Array.from({length:n},(_,i)=>'./assets/stepback-v4.1/chunk-'+String(i).padStart(2,'0')+'.txt');
 const results=await Promise.all(paths.map(async path=>{const resp=await fetch(path);if(!resp.ok)throw Error(path+' HTTP '+resp.status);return resp.text()}));
 const html=results.join('');
 if(html.length!==5029685 || !html.startsWith('<!doctype html>') || !html.endsWith('</script></body></html>'))throw Error('文件不完整，请刷新重新加载');
 document.open();document.write(html);document.close();
})().catch(e=>{document.getElementById('status').textContent='加载失败：'+e.message;console.error(e)});
</script></body></html>

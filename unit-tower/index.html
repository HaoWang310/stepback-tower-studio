<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>单体塔楼生成器 · Unit Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --panel:#0b0b0c; --line:#1c1c1e; --line2:#2c2c2e;
  --t1:#f5f5f7; --t2:rgba(245,245,247,.56); --t3:rgba(245,245,247,.34);
  --accent:#ff6a3d; --r:12px;
  --font:"DM Sans",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
#app{display:flex;height:100%;gap:12px;padding:12px}
#panel{width:300px;flex:none;background:var(--panel);border:0.5px solid var(--line2);border-radius:16px;overflow-y:auto;padding:18px 18px 22px;scrollbar-width:thin;scrollbar-color:#2c2c2e transparent}
#view{position:relative;flex:1;min-width:0;background:#030303;border:0.5px solid var(--line2);border-radius:16px;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
h1{font-size:17px;font-weight:500;letter-spacing:-.01em}
.sub{color:var(--t2);font-size:12px;margin-top:4px;line-height:1.5}
.sec{margin-top:22px;padding-top:18px;border-top:0.5px solid var(--line)}
.sec h2{font-size:13px;font-weight:500;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.sec h2 span{color:var(--t3);font-weight:400;font-size:11px}
#drop{border:0.8px dashed #48484a;border-radius:10px;padding:16px 10px;text-align:center;color:var(--t2);cursor:pointer;transition:border-color .2s,background .2s;line-height:1.5}
#drop:hover,#drop.over{border-color:var(--t1);background:rgba(255,255,255,.03);color:var(--t1)}
#drop b{font-weight:500;color:var(--t1)}
.info{margin-top:10px;color:var(--t2);font-size:12px;line-height:1.7}
.info .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.row:first-of-type{margin-top:0}
.row label{color:var(--t2)}
.num{width:66px;background:transparent;border:0;color:var(--t1);font:inherit;text-align:right;padding:2px 0;border-bottom:0.5px solid transparent;outline:none;-moz-appearance:textfield}
.num:focus{border-bottom-color:var(--t2)}
.num::-webkit-inner-spin-button,.num::-webkit-outer-spin-button{-webkit-appearance:none}
.unit{color:var(--t3);margin-left:3px;font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin-top:4px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:1px;background:linear-gradient(to right,var(--t1) var(--p,50%),#3a3a3c var(--p,50%))}
input[type=range]::-moz-range-track{height:2px;border-radius:1px;background:#3a3a3c}
input[type=range]::-moz-range-progress{height:2px;background:var(--t1)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--t1);margin-top:-6px;border:0}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--t1);border:0}
.seg{display:inline-flex;background:#1c1c1e;border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;color:var(--t2);font:inherit;font-size:12px;padding:4px 10px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--t1);color:#000}
.read{color:var(--t3);font-size:11.5px;margin-top:8px;line-height:1.6}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.btn{border:0.5px solid #48484a;background:transparent;color:var(--t1);font:inherit;font-weight:500;padding:9px 0;border-radius:9px;cursor:pointer;transition:background .2s}
.btn:hover{background:rgba(255,255,255,.06)}
.btn.primary{background:var(--t1);color:#000;border-color:var(--t1)}
.btn.primary:hover{background:#fff}
.btn:disabled{opacity:.4;cursor:default}
.link{background:none;border:0;color:var(--t2);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-top:8px}
.warn{color:#ff453a}
#hud{position:absolute;left:0;right:0;bottom:16px;text-align:center;pointer-events:none}
#hud .a{font-size:13px;color:var(--t1)}
#hud .b{font-size:11.5px;color:var(--t3);margin-top:4px}
#tools{position:absolute;top:12px;right:12px;display:flex;gap:6px}
#tools button{background:rgba(28,28,30,.8);border:0.5px solid var(--line2);color:var(--t2);font:inherit;font-size:12px;padding:6px 10px;border-radius:8px;cursor:pointer}
#tools button:hover{color:var(--t1)}
#tools button.on{background:var(--t1);color:#000;border-color:var(--t1)}
#legend{position:absolute;left:18px;bottom:18px;display:grid;grid-template-columns:auto auto;gap:4px 10px;font-size:11px;color:var(--t2);pointer-events:none}
#legend span{grid-column:1/3}
#legend i{grid-column:1/3;display:block;width:150px;height:6px;border-radius:3px;background:linear-gradient(to right,#ededf2,#ff6a3d)}
#legend b{font-weight:400}#legend #legB{text-align:right}
#cap{position:absolute;top:16px;left:18px;max-width:60%;pointer-events:none}
#cap .k{font-size:11px;color:var(--t3);letter-spacing:.04em}
#cap .t{font-size:18px;font-weight:500;margin-top:4px;letter-spacing:-.01em}
#cap .s{font-size:12.5px;color:var(--t2);margin-top:4px;line-height:1.5}
#cap .bar{display:flex;gap:4px;margin-top:10px}
#cap .bar i{display:block;width:22px;height:3px;border-radius:2px;background:#2c2c2e;transition:background .3s}
#cap .bar i.on{background:var(--t1)}
#cap .bar i.orbit.on{background:#64d2ff}
#toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(28,28,30,.92);border:0.5px solid var(--line2);padding:8px 14px;border-radius:10px;font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:13px;pointer-events:none}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--t2);text-align:center;padding:30px}
.hidden{display:none!important}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec h2 b{font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{min-width:34px;border:0.5px solid #48484a;background:transparent;color:var(--t2);font:inherit;font-size:12px;padding:5px 0;border-radius:8px;cursor:pointer}
.chips button.on{background:var(--t1);color:#000;border-color:var(--t1)}
@media (max-width:760px){
  #app{flex-direction:column-reverse;padding:8px;gap:8px}
  #panel{width:auto;height:46%;border-radius:14px}
  #view{flex:1}
}
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <div class="head"><h1 data-i18n="title">单体塔楼生成器</h1><div class="seg" id="segLang"><button data-v="zh">中</button><button data-v="en">EN</button></div></div>
    <p class="sub" data-i18n="sub"></p>

    <div class="sec">
      <h2><b data-i18n="secInput"></b> <span id="fname"></span></h2>
      <div id="drop" data-i18n-html="drop"></div>
      <input id="file" type="file" accept=".stl,model/stl" hidden>
      <div class="info" id="info"></div>
      <div class="row"><label data-i18n="units"></label>
        <div class="seg" id="segUnit"><button data-v="0.001">mm</button><button data-v="0.01">cm</button><button data-v="1">m</button></div></div>
      <div class="row"><label data-i18n="upAxis"></label>
        <div class="seg" id="segUp"><button data-v="z" class="on">Z</button><button data-v="y">Y</button></div></div>
      <div><button class="link" id="btnUnit" data-i18n="btnUnit"></button> <button class="link" id="btnSample" style="margin-left:12px" data-i18n="btnSample"></button><button class="link hidden" id="btnForget" style="margin-left:12px" data-i18n="forget"></button></div>
    </div>

    <div class="sec" id="secThick">
      <h2><b data-i18n="secThick"></b> <span data-i18n="thickNote"></span></h2>
      <div class="row"><label data-i18n="thickness"></label><span><input class="num" id="nThick" type="number" step="0.01"><span class="unit">m</span></span></div>
      <input type="range" id="rThick" min="0.01" max="1" step="0.01">
    </div>

    <div class="sec">
      <h2 data-i18n="secStack"></h2>
      <div class="row"><label data-i18n="floors"></label><span><input class="num" id="nCount" type="number" step="1"></span></div>
      <input type="range" id="rCount" min="1" max="120" step="1">
      <div class="row"><label data-i18n="gap"></label><span><input class="num" id="nGap" type="number" step="0.1"><span class="unit">m</span></span></div>
      <input type="range" id="rGap" min="0" max="12" step="0.1">
      <div class="read" id="readStack"></div>
    </div>

    <div class="sec">
      <h2 data-i18n="secWaist"></h2>
      <div class="row"><label data-i18n="minR"></label><span><input class="num" id="nMin" type="number" step="0.01"></span></div>
      <input type="range" id="rMin" min="0.2" max="1.5" step="0.01">
      <div class="row"><label data-i18n="curve"></label>
        <div class="seg" id="segCurve"><button data-v="linear" class="on" data-i18n="linear"></button><button data-v="smooth" data-i18n="smooth"></button></div></div>
      <div class="row"><label data-i18n="shade"></label>
        <div class="seg" id="segShade"><button data-v="0" class="on" data-i18n="whiteModel"></button><button data-v="1" data-i18n="waistColour"></button></div></div>
      <div class="row"><label data-i18n="envLines"></label>
        <div class="seg" id="segEnv"><button data-v="1" class="on" data-i18n="show"></button><button data-v="0" data-i18n="hide"></button></div></div>
      <div class="read" id="readWaist"></div>
    </div>

    <div class="sec">
      <h2 data-i18n="secTwist"></h2>
      <div class="row"><label data-i18n="step"></label><span><input class="num" id="nRot" type="number" step="0.5"><span class="unit">°</span></span></div>
      <input type="range" id="rRot" min="-90" max="90" step="0.5">
      <div class="row"><label data-i18n="pivot"></label>
        <div class="seg" id="segPivot"><button data-v="centroid" class="on" data-i18n="centroid"></button><button data-v="bbox" data-i18n="bboxc"></button></div></div>
      <div class="read" id="readTwist"></div>
    </div>

    <div class="sec" id="secPrint">
      <h2><b data-i18n="secPrint"></b> <span>Bambu Lab A1 · 256 mm</span></h2>
      <div class="row"><label data-i18n="scale"></label>
        <div class="seg" id="segScale"><button data-v="300">1:300</button><button data-v="500" class="on">1:500</button><button data-v="750">1:750</button><button data-v="1000">1:1000</button></div></div>
      <div class="row"><label data-i18n="wall"></label><span><input class="num" id="nWall" type="number" step="0.1"><span class="unit">mm</span></span></div>
      <input type="range" id="rWall" min="0.4" max="3" step="0.1">
      <div class="row"><label data-i18n="labels"></label>
        <div class="seg" id="segLabel"><button data-v="1" class="on" data-i18n="emboss"></button><button data-v="0" data-i18n="noEmboss"></button></div></div>
      <div class="row"><label data-i18n="margin"></label><span><input class="num" id="nMargin" type="number" step="1" style="width:40px"><span class="unit">mm</span></span></div>
      <div class="row"><label data-i18n="gapP"></label><span><input class="num" id="nGapP" type="number" step="1" style="width:40px"><span class="unit">mm</span></span></div>
      <div class="read" id="readPrint"></div>
      <div class="row"><label data-i18n="prevFloor"></label><span><input class="num" id="nPrev" type="number" step="1" value="1" style="width:40px"><span class="unit" data-i18n="prevUnit"></span></span></div>
      <div class="btns" style="grid-template-columns:1fr 1fr;margin-top:12px">
        <button class="btn" id="btnPrev" data-i18n="btnPrev"></button>
        <button class="btn" id="btnPlates" data-i18n="btnPlates"></button>
      </div>
      <div id="plateChips" class="chips hidden"></div>
      <button class="btn primary" id="btnPrint" style="width:100%;margin-top:8px" data-i18n="btnPrint"></button>
    </div>

    <div class="sec">
      <h2><b data-i18n="secExport"></b> <span id="expInfo"></span></h2>
      <div class="btns">
        <button class="btn primary" id="exSTL">STL</button>
        <button class="btn" id="exOBJ">OBJ</button>
        <button class="btn" id="ex3DM">3DM</button>
      </div>
      <div class="read" id="readExport"></div>
      <button class="link" id="btnReset" data-i18n="reset"></button>
    </div>
  </aside>

  <main id="view">
    <canvas id="gl"></canvas>
    <div id="tools"><button id="btnPlay"></button><button id="btnFit" data-i18n="fit"></button></div>
    <div id="cap" class="hidden"><div class="k" id="capK"></div><div class="t" id="capT"></div><div class="s" id="capS"></div><div class="bar" id="capBar"><i></i><i></i><i></i><i></i><i></i></div></div>
    <div id="toast"></div>
    <div id="legend" class="hidden"><span data-i18n="legend"></span><i></i><b id="legA">1.00</b><b id="legB">0.62</b></div>
    <div id="hud"><div class="a" id="hudA"></div><div class="b" data-i18n="hint"></div></div>
    <div id="err"></div>
    <div id="loading" data-i18n="loadingUnit"></div>
  </main>
</div>

<script>
// ===================== CORE-BEGIN (pure geometry, no DOM) =====================
const Core = (() => {
  function parseSTL(buf) {
    const dv = new DataView(buf);
    const bytes = new Uint8Array(buf);
    let isBinary = false;
    if (buf.byteLength >= 84) {
      const n = dv.getUint32(80, true);
      if (84 + n * 50 === buf.byteLength) isBinary = true;
    }
    if (!isBinary) {
      const head = new TextDecoder().decode(bytes.subarray(0, Math.min(1024, bytes.length))).toLowerCase();
      if (!(head.trimStart().startsWith('solid') && head.includes('facet'))) {
        if (buf.byteLength >= 84) isBinary = true;
      }
    }
    if (isBinary) {
      const n = Math.min(dv.getUint32(80, true), Math.floor((buf.byteLength - 84) / 50));
      const pos = new Float32Array(n * 9);
      for (let i = 0; i < n; i++) {
        const o = 84 + i * 50 + 12;
        for (let k = 0; k < 9; k++) pos[i * 9 + k] = dv.getFloat32(o + k * 4, true);
      }
      return pos;
    }
    const text = new TextDecoder().decode(bytes);
    const re = /vertex\s+([-+\d.eE]+)\s+([-+\d.eE]+)\s+([-+\d.eE]+)/g;
    const out = [];
    let m;
    while ((m = re.exec(text))) out.push(+m[1], +m[2], +m[3]);
    const usable = out.length - (out.length % 9);
    return new Float32Array(out.slice(0, usable));
  }

  function bbox(V) {
    const mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
    for (let i = 0; i < V.length; i += 3)
      for (let k = 0; k < 3; k++) { const v = V[i + k]; if (v < mn[k]) mn[k] = v; if (v > mx[k]) mx[k] = v; }
    return { min: mn, max: mx, size: [mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2]] };
  }

  // triangle soup -> indexed mesh, dropping degenerate triangles
  function weld(pos, upY) {
    const P = new Float64Array(pos.length);
    for (let i = 0; i < pos.length; i += 3) {
      if (upY) { P[i] = pos[i]; P[i + 1] = -pos[i + 2]; P[i + 2] = pos[i + 1]; }
      else { P[i] = pos[i]; P[i + 1] = pos[i + 1]; P[i + 2] = pos[i + 2]; }
    }
    const bb = bbox(P);
    const diag = Math.hypot(...bb.size) || 1;
    const tol = diag * 1e-7;
    const map = new Map();
    const V = [];
    const idx = new Uint32Array(P.length / 3);
    for (let i = 0; i < P.length / 3; i++) {
      const x = P[i * 3], y = P[i * 3 + 1], z = P[i * 3 + 2];
      const key = Math.round(x / tol) + ',' + Math.round(y / tol) + ',' + Math.round(z / tol);
      let id = map.get(key);
      if (id === undefined) { id = V.length / 3; map.set(key, id); V.push(x, y, z); }
      idx[i] = id;
    }
    const F = [];
    for (let t = 0; t < idx.length; t += 3) {
      const a = idx[t], b = idx[t + 1], c = idx[t + 2];
      if (a !== b && b !== c && a !== c) F.push(a, b, c);
    }
    return { V: new Float64Array(V), F: new Uint32Array(F) };
  }

  function edgeStats(F, nv) {
    const cnt = new Map();
    const dir = new Map();
    for (let t = 0; t < F.length; t += 3) {
      for (let e = 0; e < 3; e++) {
        const a = F[t + e], b = F[t + (e + 1) % 3];
        const key = a < b ? a * nv + b : b * nv + a;
        cnt.set(key, (cnt.get(key) || 0) + 1);
        dir.set(key, [a, b]);
      }
    }
    const boundary = [];
    let nonManifold = 0;
    for (const [k, c] of cnt) {
      if (c === 1) boundary.push(dir.get(k));
      else if (c > 2) nonManifold++;
    }
    return { closed: boundary.length === 0 && nonManifold === 0, boundary, nonManifold, edges: cnt.size };
  }

  function volumeCentroid(V, F) {
    let vol = 0, cx = 0, cy = 0, cz = 0;
    for (let t = 0; t < F.length; t += 3) {
      const a = F[t] * 3, b = F[t + 1] * 3, c = F[t + 2] * 3;
      const ax = V[a], ay = V[a + 1], az = V[a + 2];
      const bx = V[b], by = V[b + 1], bz = V[b + 2];
      const qx = V[c], qy = V[c + 1], qz = V[c + 2];
      const v = (ax * (by * qz - bz * qy) - ay * (bx * qz - bz * qx) + az * (bx * qy - by * qx)) / 6;
      vol += v; cx += v * (ax + bx + qx) / 4; cy += v * (ay + by + qy) / 4; cz += v * (az + bz + qz) / 4;
    }
    return { vol, c: vol !== 0 ? [cx / vol, cy / vol, cz / vol] : null };
  }

  function areaCentroid(V, F) {
    let A = 0, cx = 0, cy = 0, cz = 0;
    for (let t = 0; t < F.length; t += 3) {
      const a = F[t] * 3, b = F[t + 1] * 3, c = F[t + 2] * 3;
      const ux = V[b] - V[a], uy = V[b + 1] - V[a + 1], uz = V[b + 2] - V[a + 2];
      const wx = V[c] - V[a], wy = V[c + 1] - V[a + 1], wz = V[c + 2] - V[a + 2];
      const ar = Math.hypot(uy * wz - uz * wy, uz * wx - ux * wz, ux * wy - uy * wx) / 2;
      A += ar;
      cx += ar * (V[a] + V[b] + V[c]) / 3; cy += ar * (V[a + 1] + V[b + 1] + V[c + 1]) / 3; cz += ar * (V[a + 2] + V[b + 2] + V[c + 2]) / 3;
    }
    return { area: A, c: A > 0 ? [cx / A, cy / A, cz / A] : [0, 0, 0] };
  }

  function vertexNormals(V, F) {
    const N = new Float64Array(V.length);
    for (let t = 0; t < F.length; t += 3) {
      const a = F[t] * 3, b = F[t + 1] * 3, c = F[t + 2] * 3;
      const ux = V[b] - V[a], uy = V[b + 1] - V[a + 1], uz = V[b + 2] - V[a + 2];
      const wx = V[c] - V[a], wy = V[c + 1] - V[a + 1], wz = V[c + 2] - V[a + 2];
      const nx = uy * wz - uz * wy, ny = uz * wx - ux * wz, nz = ux * wy - uy * wx;
      for (const i of [a, b, c]) { N[i] += nx; N[i + 1] += ny; N[i + 2] += nz; }
    }
    for (let i = 0; i < N.length; i += 3) {
      const l = Math.hypot(N[i], N[i + 1], N[i + 2]) || 1;
      N[i] /= l; N[i + 1] /= l; N[i + 2] /= l;
    }
    return N;
  }

  // ---- unify normals + two-sided shell (works for non-orientable patch assemblies) ----
  function faceNormals(V, F) {
    const nf = F.length / 3, N = new Float64Array(nf * 3), A = new Float64Array(nf);
    for (let f = 0; f < nf; f++) {
      const a = F[f * 3] * 3, b = F[f * 3 + 1] * 3, c = F[f * 3 + 2] * 3;
      const ux = V[b] - V[a], uy = V[b + 1] - V[a + 1], uz = V[b + 2] - V[a + 2];
      const wx = V[c] - V[a], wy = V[c + 1] - V[a + 1], wz = V[c + 2] - V[a + 2];
      const nx = uy * wz - uz * wy, ny = uz * wx - ux * wz, nz = ux * wy - uy * wx;
      const l = Math.hypot(nx, ny, nz) || 1;
      N[f * 3] = nx / l; N[f * 3 + 1] = ny / l; N[f * 3 + 2] = nz / l; A[f] = l / 2;

  }
  // edge -> [face, startVertex, face, startVertex, ...]
  function edgeFaces(F, nv) {
    const m = new Map();
    for (let f = 0; f < F.length / 3; f++)
      for (let e = 0; e < 3; e++) {
        const a = F[f * 3 + e], b = F[f * 3 + (e + 1) % 3];
        const k = a < b ? a * nv + b : b * nv + a;
        let l = m.get(k); if (!l) m.set(k, l = []);
        l.push(f, a, e);
      }
    return m;
  }

  // like Rhino UnifyMeshNormals, but crossing the smoothest edges first, so that edges that can
  // never agree (twisted assemblies) end up where the surface turns over rather than mid-panel
  function unifyNormals(V, F) {
    const nv = V.length / 3, nf = F.length / 3;
    const { N } = faceNormals(V, F);
    const em = edgeFaces(F, nv);
    const deg = new Uint32Array(nf + 1);
    for (const l of em.values()) if (l.length === 6) { deg[l[0] + 1]++; deg[l[3] + 1]++; }
    for (let i = 0; i < nf; i++) deg[i + 1] += deg[i];
    const nbF = new Uint32Array(deg[nf]), nbS = new Uint8Array(deg[nf]), nbQ = new Float32Array(deg[nf]);
    const fill = deg.slice(0, nf);
    for (const l of em.values()) if (l.length === 6) {
      const f = l[0], g = l[3], s = l[1] === l[4] ? 1 : 0;
      const q = Math.abs(N[f * 3] * N[g * 3] + N[f * 3 + 1] * N[g * 3 + 1] + N[f * 3 + 2] * N[g * 3 + 2]);
      let i = fill[f]++; nbF[i] = g; nbS[i] = s; nbQ[i] = q;
      i = fill[g]++; nbF[i] = f; nbS[i] = s; nbQ[i] = q;
    }
    const flip = new Int8Array(nf).fill(-1);
    const hq = [], hf = [], hg = [], hs = [];
    const push = (q, f, g, s) => {
      let i = hq.length; hq.push(q); hf.push(f); hg.push(g); hs.push(s);
      while (i > 0) { const p = (i - 1) >> 1; if (hq[p] >= hq[i]) break; swap(p, i); i = p; }
    };
    const swap = (i, j) => { let t = hq[i]; hq[i] = hq[j]; hq[j] = t; t = hf[i]; hf[i] = hf[j]; hf[j] = t; t = hg[i]; hg[i] = hg[j]; hg[j] = t; t = hs[i]; hs[i] = hs[j]; hs[j] = t; };
    const pop = () => {
      const r = [hf[0], hg[0], hs[0]];
      const last = hq.length - 1; swap(0, last); hq.pop(); hf.pop(); hg.pop(); hs.pop();
      let i = 0;
      for (;;) { const a = 2 * i + 1, b = a + 1; let m = i; if (a < hq.length && hq[a] > hq[m]) m = a; if (b < hq.length && hq[b] > hq[m]) m = b; if (m === i) break; swap(m, i); i = m; }
      return r;
    };
    // seed each connected patch with its largest-area-agreeing start: keep the majority orientation
    for (let s0 = 0; s0 < nf; s0++) {
      if (flip[s0] >= 0) continue;
      flip[s0] = 0;
      const members = [s0];
      for (let i = deg[s0]; i < deg[s0 + 1]; i++) push(nbQ[i], s0, nbF[i], nbS[i]);
      while (hq.length) {
        const [f, g, s] = pop();
        if (flip[g] >= 0) continue;
        flip[g] = flip[f] ^ s; members.push(g);
        for (let i = deg[g]; i < deg[g + 1]; i++) if (flip[nbF[i]] < 0) push(nbQ[i], g, nbF[i], nbS[i]);
      }
      let k = 0; for (const f of members) k += flip[f];
      if (k * 2 > members.length) for (const f of members) flip[f] ^= 1;
    }
    const F2 = new Uint32Array(F);
    let flipped = 0;
    for (let f = 0; f < nf; f++) if (flip[f]) { flipped++; const t = F2[f * 3 + 1]; F2[f * 3 + 1] = F2[f * 3 + 2]; F2[f * 3 + 2] = t; }
    let before = 0;
    for (const l of em.values()) if (l.length === 6 && l[1] === l[4]) before++;
    return { F: F2, flipped, before };
  }

  // two-sided thickening (total t, t/2 each side) of a unified mesh. Where the orientation cannot
  // agree ("twist" edges) the sheet is cut, and top/bottom of the two sides are stitched crosswise,
  // so the shell stays closed and continuous.
  function shell(V, F0, t, planeZ) {
    const nv = V.length / 3;
    const u = unifyNormals(V, F0);
    const F = u.F, nf = F.length / 3;
    const { N, A } = faceNormals(V, F);
    const em = edgeFaces(F, nv);
    // corners (face*3+k) -> vertex copies; join corners across smooth, agreeing edges
    const P = new Int32Array(nf * 3); for (let i = 0; i < P.length; i++) P[i] = i;
    const find = x => { while (P[x] !== x) { P[x] = P[P[x]]; x = P[x]; } return x; };
    const join = (a, b) => { a = find(a); b = find(b); if (a !== b) P[a] = b; };
    const corner = (f, v) => f * 3 + (F[f * 3] === v ? 0 : F[f * 3 + 1] === v ? 1 : 2);

    const open = [];
    for (const l of em.values()) {

        if (l[1] !== l[4]) { join(corner(f, a), corner(g, a)); join(corner(f, b), corner(g, b)); }
        else twist.push(f, g, a, b);

    const Q = new Int32Array(nf * 3), R = new Uint8Array(nf * 3);

    const findQ = x => { let p = 0; const path = []; while (Q[x] !== x) { path.push(x); p ^= R[x]; x = Q[x]; } let acc = p; for (const y of path) { const r = R[y]; Q[y] = x; R[y] = acc; acc ^= r; } return [x, p]; };
    const joinQ = (a, b, par) => { const [ra, pa] = findQ(a), [rb, pb] = findQ(b); if (ra !== rb) { Q[ra] = rb; R[ra] = pa ^ pb ^ par; } };
    for (let i = 0; i < twist.length; i += 4) {
      const [f, g, a, b] = [twist[i], twist[i + 1], twist[i + 2], twist[i + 3]];
      joinQ(find(corner(f, a)), find(corner(g, a)), 1);
      joinQ(find(corner(f, b)), find(corner(g, b)), 1);
    }

    const acc = new Map();
    const vOf = new Int32Array(nf * 3);
    for (let c = 0; c < nf * 3; c++) {
      const f = (c / 3) | 0, g = find(c);
      const [root, par] = findQ(g);
      vOf[c] = F[c];
      let e = acc.get(root); if (!e) acc.set(root, e = [0, 0, 0, F[c]]);
      const sg = par ? -1 : 1, w = A[f];
      e[0] += sg * N[f * 3] * w; e[1] += sg * N[f * 3 + 1] * w; e[2] += sg * N[f * 3 + 2] * w;
    }
    const outV = [];
    const idx = new Map();
    for (const [root, e] of acc) {
      const v = e[3] * 3;
      let l = Math.hypot(e[0], e[1], e[2]);
      let nx = e[0], ny = e[1], nz = e[2];
      if (l < 1e-12) { nx = 0; ny = 0; nz = 1; l = 1; }
      let ox = nx * t / 2 / l, oy = ny * t / 2 / l, oz = nz * t / 2 / l;
      if (planeZ !== undefined && Math.abs(V[v + 2] - planeZ) < 1e-6 * (1 + Math.abs(planeZ))) {
        // move the offset point along the wall (within its tangent plane) until it lies on the cut plane
        const ux = nx / l, uy = ny / l, uz = nz / l, gz = 1 - uz * uz;
        if (gz > 0.15) { const k = oz / gz; ox += k * ux * uz; oy += k * uy * uz; oz = 0; }

      }
      const i = outV.length / 3;
      outV.push(V[v] + ox, V[v + 1] + oy, V[v + 2] + oz, V[v] - ox, V[v + 1] - oy, V[v + 2] - oz);
      idx.set(root, i);
    }
    const top = c => { const [root, par] = findQ(find(c)); return idx.get(root) + par; };
    const bot = c => { const [root, par] = findQ(find(c)); return idx.get(root) + 1 - par; };
    const out = [];
    for (let f = 0; f < nf; f++) {
      const c = f * 3;
      out.push(top(c), top(c + 1), top(c + 2), bot(c), bot(c + 2), bot(c + 1));
    }
    for (let i = 0; i < open.length; i += 2) {
      const f = open[i], e = open[i + 1];

    return { V: Vo, F: Fo, flipped: u.flipped, before: u.before, twist: twist.length / 4 };
  }

  // per-floor scale factors; for an even floor count this equals the gh
  // (Series 1, -step, n/2) + Reverse + Merge exactly
  function profile(n, minR, curve) {
    const s = new Float64Array(n);
    const kmax = Math.floor((n - 1) / 2);
    for (let i = 0; i < n; i++) {
      if (kmax === 0) { s[i] = 1; continue; }
      const u = Math.min(i, n - 1 - i) / kmax;
      s[i] = curve === 'smooth' ? 1 - (1 - minR) * (1 - Math.cos(Math.PI * u)) / 2 : 1 - (1 - minR) * u;
    }
    return s;
  }

  function floors(p) {
    const s = profile(p.count, p.minR, p.curve);
    const out = [];
    for (let i = 0; i < p.count; i++) out.push({ i, z: i * p.pitch, s: s[i], th: i * p.stepDeg * Math.PI / 180 });
    return out;
  }

  // world position of a base vertex on floor f (scale XY then rotate about the vertical axis through c)
  function xf(x, y, z, c, f) {

    const cs = Math.cos(f.th), sn = Math.sin(f.th);
    return [c[0] + cs * dx - sn * dy, c[1] + sn * dx + cs * dy, z + f.z];
  }

  function exportSTL(V, F, c, fl, k) {
    const nt = F.length / 3;
    const buf = new ArrayBuffer(84 + nt * fl.length * 50);
    const dv = new DataView(buf);
    const hdr = 'Unit Tower generator (gh logic) ' + fl.length + ' floors';
    for (let i = 0; i < Math.min(80, hdr.length); i++) dv.setUint8(i, hdr.charCodeAt(i) & 127);
    dv.setUint32(80, nt * fl.length, true);
    let o = 84;
    const nv = V.length / 3;
    const W = new Float64Array(nv * 3);
    for (const f of fl) {
      for (let v = 0; v < nv; v++) {
        const q = xf(V[v * 3], V[v * 3 + 1], V[v * 3 + 2], c, f);
        W[v * 3] = q[0] * k; W[v * 3 + 1] = q[1] * k; W[v * 3 + 2] = q[2] * k;
      }
      for (let t = 0; t < F.length; t += 3) {
        const a = F[t] * 3, b = F[t + 1] * 3, d = F[t + 2] * 3;
        const ux = W[b] - W[a], uy = W[b + 1] - W[a + 1], uz = W[b + 2] - W[a + 2];
        const wx = W[d] - W[a], wy = W[d + 1] - W[a + 1], wz = W[d + 2] - W[a + 2];

          o += 12;
        }
        o += 2;
      }

  }

  function exportOBJ(V, F, c, fl, k) {
    const nv = V.length / 3;
    const parts = ['# Unit Tower generator (gh logic), ' + fl.length + ' floors\n'];
    let base = 0;
    for (const f of fl) {
      const L = ['o floor_' + String(f.i + 1).padStart(3, '0')];
      for (let v = 0; v < nv; v++) {
        const q = xf(V[v * 3], V[v * 3 + 1], V[v * 3 + 2], c, f);
        L.push('v ' + +(q[0] * k).toFixed(6) + ' ' + +(q[1] * k).toFixed(6) + ' ' + +(q[2] * k).toFixed(6));
      }
      for (let t = 0; t < F.length; t += 3) L.push('f ' + (F[t] + 1 + base) + ' ' + (F[t + 1] + 1 + base) + ' ' + (F[t + 2] + 1 + base));

  // rhino: an initialised rhino3dm module
  function export3DM(rhino, V, F, c, fl, k, unitName) {
    const doc = new rhino.File3dm();
    try { doc.settings().modelUnitSystem = rhino.UnitSystem[unitName]; } catch (e) {}
    let layerIndex = 0;
    try {
      const layer = new rhino.Layer();
      layer.name = 'Unit Tower';
      doc.layers().add(layer);
    } catch (e) {}
    const nv = V.length / 3;
    for (const f of fl) {
      const mesh = new rhino.Mesh();
      const vs = mesh.vertices(), fs = mesh.faces();
      for (let v = 0; v < nv; v++) {
        const q = xf(V[v * 3], V[v * 3 + 1], V[v * 3 + 2], c, f);
        vs.add(q[0] * k, q[1] * k, q[2] * k);
      }
      for (let t = 0; t < F.length; t += 3) fs.addTriFace(F[t], F[t + 1], F[t + 2]);
      try { mesh.normals().computeNormals(); mesh.compact(); } catch (e) {}
      const att = new rhino.ObjectAttributes();
      att.layerIndex = layerIndex;
      att.name = 'F' + String(f.i + 1).padStart(2, '0');
      doc.objects().add(mesh, att);
    }
    return doc.toByteArray();
  }

  // sample: rounded-rectangle floor plate, open surface (the gh thickens it by 0.1)
  function samplePlate(w = 30, d = 18, r = 4, seg = 10) {
    const pts = [];
    const cs = [[w / 2 - r, d / 2 - r, 0], [-w / 2 + r, d / 2 - r, 90], [-w / 2 + r, -d / 2 + r, 180], [w / 2 - r, -d / 2 + r, 270]];
    for (const [cx, cy, a0] of cs)
      for (let j = 0; j <= seg; j++) {
        const a = (a0 + 90 * j / seg) * Math.PI / 180;
        pts.push(cx + r * Math.cos(a), cy + r * Math.sin(a));
      }
    const m = pts.length / 2;
    const tri = [];
    for (let i = 0; i < m; i++) {
      const j = (i + 1) % m;
      tri.push(0, 0, 0, pts[i * 2], pts[i * 2 + 1], 0, pts[j * 2], pts[j * 2 + 1], 0);
    }
    return new Float32Array(tri);
  }

  // ---------------- print parts (cut each floor in half, constant wall, labels) ----------------
  // split an open surface at z = zc into two triangle soups, sharing the exact cut points
  function cutZ(V, F, zc) {
    const nv = V.length / 3;
    const bb = bbox(V);
    const eps = (Math.hypot(...bb.size) || 1) * 1e-6;
    const d = new Float64Array(nv), sg = new Int8Array(nv);
    for (let i = 0; i < nv; i++) { d[i] = V[i * 3 + 2] - zc; sg[i] = Math.abs(d[i]) <= eps ? 0 : d[i] > 0 ? 1 : -1; }
    // vertices on the plane are snapped onto it exactly, so both halves share them
    const P = i => sg[i] === 0 ? [V[i * 3], V[i * 3 + 1], zc] : [V[i * 3], V[i * 3 + 1], V[i * 3 + 2]];
    const cutP = (a, b) => {
      const lo = Math.min(a, b), hi = Math.max(a, b), t = d[lo] / (d[lo] - d[hi]);
      return [V[lo * 3] + (V[hi * 3] - V[lo * 3]) * t, V[lo * 3 + 1] + (V[hi * 3 + 1] - V[lo * 3 + 1]) * t, zc];
    };
    const out = [[], []];                       // 0 = below, 1 = above
    const tri = (h, p, q, r) => out[h].push(...p, ...q, ...r);
    for (let t = 0; t < F.length; t += 3) {
      const ids = [F[t], F[t + 1], F[t + 2]], s3 = ids.map(i => sg[i]);
      const hasP = s3.includes(1), hasN = s3.includes(-1);
      if (!hasP || !hasN) { tri(hasP ? 1 : 0, P(ids[0]), P(ids[1]), P(ids[2])); continue; }
      const z = s3.indexOf(0);
      if (z >= 0) {
        // one vertex on the plane, the other two on opposite sides: split along the line through it
        const p = ids[z], q = ids[(z + 1) % 3], r = ids[(z + 2) % 3], X = cutP(q, r);
        tri(sg[q] > 0 ? 1 : 0, P(p), P(q), X);
        tri(sg[r] > 0 ? 1 : 0, P(p), X, P(r));
        continue;
      }
      const k = s3[0] !== s3[1] && s3[0] !== s3[2] ? 0 : s3[1] !== s3[0] && s3[1] !== s3[2] ? 1 : 2;
      const p = ids[k], q = ids[(k + 1) % 3], r = ids[(k + 2) % 3];
      const P1 = cutP(p, q), P2 = cutP(p, r), hp = sg[p] > 0 ? 1 : 0;
      tri(hp, P(p), P1, P2);
      tri(1 - hp, P1, P(q), P(r));
      tri(1 - hp, P1, P(r), P2);
    }
    return { lo: weld(new Float32Array(out[0]), false), hi: weld(new Float32Array(out[1]), false), zc };
  }

  function boxTris(x0, y0, z0, x1, y1, z1, V, F) {
    const b = V.length / 3;
    V.push(x0, y0, z0, x1, y0, z0, x1, y1, z0, x0, y1, z0, x0, y0, z1, x1, y0, z1, x1, y1, z1, x0, y1, z1);
    const q = [[0, 2, 1], [0, 3, 2], [4, 5, 6], [4, 6, 7], [0, 1, 5], [0, 5, 4], [1, 2, 6], [1, 6, 5], [2, 3, 7], [2, 7, 6], [3, 0, 4], [3, 4, 7]];

  const SEG = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg', '-': 'g' };
  // 7-segment text as raised boxes; returns rectangles in (u,v) text space
  function glyphRects(text, W, H, bar, gap) {
    const R = [];
    let u = 0;
    for (const ch of text) {
      const segs = SEG[ch] || '';
      const S = {
        a: [0, H - bar, W, H], d: [0, 0, W, bar], g: [0, (H - bar) / 2, W, (H + bar) / 2],
        f: [0, H / 2 - bar / 2, bar, H], b: [W - bar, H / 2 - bar / 2, W, H], e: [0, 0, bar, H / 2 + bar / 2], c: [W - bar, 0, W, H / 2 + bar / 2],
      };
      for (const s of segs) { const r = S[s]; R.push([u + r[0], r[1], u + r[2], r[3]]); }
      u += W + gap;
    }
    return { R, width: u - gap, height: H };
  }

  // find a flat, upward-facing interior floor (the trough bottom) big enough for the label
  function findLabelSpot(V, F, wall, wTxt, hTxt) {
    const cand = [];
    const hist = new Map();
    for (let t = 0; t < F.length; t += 3) {
      const a = F[t] * 3, b = F[t + 1] * 3, c = F[t + 2] * 3;
      const ux = V[b] - V[a], uy = V[b + 1] - V[a + 1], uz = V[b + 2] - V[a + 2];
      const wx = V[c] - V[a], wy = V[c + 1] - V[a + 1], wz = V[c + 2] - V[a + 2];
      const nx = uy * wz - uz * wy, ny = uz * wx - ux * wz, nz = ux * wy - uy * wx;
      const l = Math.hypot(nx, ny, nz); if (!l || nz / l < 0.985) continue;
      const z = (V[a + 2] + V[b + 2] + V[c + 2]) / 3;

      const key = Math.round(z / (wall * 0.25));
      hist.set(key, (hist.get(key) || 0) + l / 2);
    }
    if (!cand.length) return null;
    let bestKey = null, bestA = 0;
    for (const [k, A] of hist) if (A > bestA || (A === bestA && k < bestKey)) { bestA = A; bestKey = k; }
    const zf = bestKey * wall * 0.25;
    const bb = bbox(V);
    const cell = 0.5;
    const nx = Math.ceil(bb.size[0] / cell) + 1, ny = Math.ceil(bb.size[1] / cell) + 1;
    const G = new Uint8Array(nx * ny), Z = new Float32Array(nx * ny);
    for (let i = 0; i < cand.length; i += 2) {
      const t = cand[i], z = cand[i + 1];
      if (Math.abs(z - zf) > wall * 0.3) continue;
      const p = [0, 1, 2].map(k => [V[F[t + k] * 3], V[F[t + k] * 3 + 1]]);

const GH = { count: 40, gap: 3.6, minR: 0.62, curve: 'linear', step: 22.5, thick: 0.1, pivot: 'centroid' };

const VIS = { colour: false, lines: true };
function applyVis(cb, lines) {

  $('legA').textContent = '1.00'; $('legB').textContent = (S.minR).toFixed(2);

const PR = { den: 500, wall: 1.2, labels: true, preview: 0, margin: 10, gap: 6, plate: 0 };

// ---------- geometry state ----------
function rebuild() {
  baseMesh = Core.weld(raw, S.upY);
  const es = Core.edgeStats(baseMesh.F, baseMesh.V.length / 3);
  let V = baseMesh.V, F = baseMesh.F, thick = false;
  if (!es.closed && es.boundary.length && es.nonManifold === 0) {
    const t = S.thick / S.unit;
    const r = Core.shell(V, F, t);
    V = r.V; F = r.F; thick = { flipped: r.flipped, before: r.before, twist: r.twist };
  }
  const bb = Core.bbox(V);
  let c;
  const vc = es.closed || thick ? Core.volumeCentroid(V, F) : { c: null };
  const bc = [(bb.min[0] + bb.max[0]) / 2, (bb.min[1] + bb.max[1]) / 2, (bb.min[2] + bb.max[2]) / 2];
  if (S.pivot === 'bbox') c = bc;
  else c = vc.c && Math.abs(vc.vol) > 1e-12 ? vc.c : Core.areaCentroid(V, F).c;
  geo = { V, F, bb, c, es, thick, h: bb.size[2] };
  halves = null;
  PR.preview = 0;
  packCache = null;
  uploadMesh();
  updateInfo();
  update(true);
}

function params() {
  return { count: S.count, pitch: geo.h + S.gap / S.unit, minR: S.minR, curve: S.curve, stepDeg: S.step };
}

// ---------- UI ----------
const fmt = (v, d = 2) => (+v.toFixed(d)).toLocaleString(LANG === 'zh' ? 'zh-CN' : 'en-GB', { maximumFractionDigits: d });
const trisText = n => LANG === 'zh' ? `${(n / 1e4).toFixed(n > 1e5 ? 0 : 1)} 万面` : n >= 1e6 ? `${(n / 1e6).toFixed(1)} M triangles` : `${Math.round(n / 1e3)} k triangles`;
function updateInfo() {
  if (!geo) return;
  const u = S.unit, s = geo.bb.size;
  const es = geo.es;
  const state = es.closed ? t('stClosed')
    : es.nonManifold ? `<span class="warn">${t('stNonManifold')}</span>`
    : t('stOpen');
  const fix = geo.thick && geo.thick.before
    ? `<br><span class="dot"></span>` + t('unified', { n: geo.thick.flipped.toLocaleString() }) + (geo.thick.twist ? t('twistSewn', { n: geo.thick.twist }) : '')
    : '';
  $('info').innerHTML =
    `${fmt(s[0] * u)} × ${fmt(s[1] * u)} × ${fmt(s[2] * u, 3)} m · ${(baseMesh.F.length / 3).toLocaleString()} ${t('faces')}<br>` +
    `<span class="dot"></span>${state}${fix}`;
  $('secThick').classList.toggle('hidden', !geo.thick);
  { const n = dispName(); $('fname').textContent = n.length > 22 ? n.slice(0, 20) + '…' : n; }
}

function update(refit, keepPlay) {
  if (!geo) return;
  if (typeof PLAY !== 'undefined' && PLAY.on && !keepPlay) stopPlay(false);
  const p = params();
  const fl = Core.floors(p);
  const u = S.unit;
  const H = ((S.count - 1) * p.pitch + geo.h) * u;
  $('readStack').textContent = t('readStack', { h: fmt(geo.h * u, 3), g: fmt(S.gap, 2), p: fmt(p.pitch * u, 3), H: fmt(H, 1) });
  const kmax = Math.floor((S.count - 1) / 2);
  const mids = S.count % 2 === 0 && S.count > 1 ? t('waistTwo', { a: S.count / 2, b: S.count / 2 + 1 }) : t('waistOne', { a: kmax + 1 });
  $('readWaist').textContent = S.count < 3 ? t('waistFew') : t('waist', { m: mids, r: fmt(S.minR, 2) });
  $('readTwist').textContent = t('twistRead', { d: fmt((S.count - 1) * S.step, 1), t: fmt(Math.abs((S.count - 1) * S.step) / 360, 2) });
  const tris = geo.F.length / 3 * S.count;
  const mb = (84 + tris * 50) / 1048576;
  $('expInfo').textContent = trisText(tris);
  $('readExport').innerHTML = (mb > 300 ? `<span class="warn">${t('stlBig', { mb: fmt(mb, 0) })}</span><br>` : (mb < 1 ? t('stlKB', { kb: fmt(mb * 1024, 0) }) : t('stlMB', { mb: fmt(mb, 1) })) + ' ') +
    t('exportNote');
  $('hudA').textContent = t('hud', { n: S.count, H: fmt(H, 1), d: fmt((S.count - 1) * S.step, 1) });
  updatePrint(fl, p);
  if (keepPlay && PLAY.on) return;
  if (PR.preview || PR.plate) { PR.preview = 0; PR.plate = 0; R.setPlate(null); R.upload(geo); refit = true; }
  $('btnPrev').textContent = t('btnPrev');
  $('btnPlates').textContent = t('btnPlates');
  renderChips();
  R.setFloors(fl, geo, p);
  applyVis(VIS.colour ? 1 : 0, VIS.lines);

}

// ---------- print parts ----------
const PLATE = 256, MARGIN = 5, GAP = 6;
function printFactor() { return S.unit * 1000 / PR.den; }              // mm per file unit
function getHalves() {
  if (!halves) {
    const bb0 = Core.bbox(baseMesh.V);
    halves = Core.cutZ(baseMesh.V, baseMesh.F, (bb0.min[2] + bb0.max[2]) / 2);
  }
  return halves;
}
function plan(fl) {
  // footprint of a full-size piece in mm (shell adds the wall on each side)
  const k = printFactor(), bb0 = Core.bbox(baseMesh.V);
  const size = s => Math.max(bb0.size[0], bb0.size[1]) * s * k + PR.wall;
  const cap = d => { const n = Math.floor((PLATE - 2 * MARGIN + GAP) / (d + GAP)); return n * n; };
  const plates = [];
  let cur = [], curMax = 0;
  for (const f of fl) {
    const d = size(f.s), m = Math.max(curMax, d);
    if (cur.length && (cur.length + 1) * 2 > cap(m)) { plates.push(cur); cur = []; curMax = 0; }
    cur.push(f.i + 1); curMax = Math.max(curMax, d);
  }
  if (cur.length) plates.push(cur);
  const sizes = fl.map(f => size(f.s));
  const halfH = (bb0.size[2] / 2) * k + PR.wall;
  return { plates, maxD: Math.max(...sizes), minD: Math.min(...sizes), halfH, fits: Math.max(...sizes) <= PLATE - 2 * MARGIN };
}
function updatePrint(fl) {
  const ok = !geo.es.closed && geo.thick;
  $('btnPrev').disabled = $('btnPrint').disabled = $('btnPlates').disabled = !ok;
  if (!ok) { $('readPrint').innerHTML = `<span class="warn">${t('printClosed')}</span>`; return; }
  const pl = plan(fl);
  const wReal = PR.wall * PR.den / 1000;
  $('readPrint').innerHTML =
    t('print1') + '<br>' +
    t('print2', { a: fmt(pl.maxD, 0), b: fmt(pl.minD, 0), h: fmt(pl.halfH, 1) }) + '<br>' +
    t('pieces', { n: S.count * 2 }) + ' · ' + (packCache && packCache.key === packKey() ? t('platesDone', { n: packCache.plates.length }) : t('platesTodo')) + ' · ' + t('wallReal', { w: fmt(wReal, 2) }) +
    (pl.fits ? '' : `<br><span class="warn">${t('tooBig', { mm: PLATE - 2 * MARGIN })}</span>`);
  $('nPrev').max = S.count;
}
function packKey() {
  return JSON.stringify([fileName, S.unit, S.upY, S.count, S.minR, S.curve, S.thick, PR.den, PR.wall, PR.margin, PR.gap]);
}
async function ensurePacked(progress) {
  const key = packKey();
  if (packCache && packCache.key === key) return packCache;
  const fl = Core.floors(params()), hv = getHalves(), k = printFactor(), dil = PR.wall + PR.gap / 2;   // the flattened cut can reach up to ~1 wall sideways
  const items = [];
  for (let i = 0; i < fl.length; i++) {
    if (progress) progress(t('progOutline', { i: i + 1, n: fl.length }));
    await new Promise(r => setTimeout(r, 0));
    for (const [part, flip, tag] of [[hv.hi, true, '-1'], [hv.lo, false, '-2']]) {
      const m0 = Core.footprintMask(part, geo.c, fl[i].s, k, flip, dil);
      items.push({ name: (i + 1) + tag, masks: [{ deg: 0, m: m0 }, { deg: 45, m: Core.rotMask(m0, 45) }] });
    }
  }
  if (progress) progress(t('progPack'));
  await new Promise(r => setTimeout(r, 0));
  const plates = Core.packPlates(items, PLATE, PR.margin, PR.gap);

}
// pieces of a floor, with a small cache (a floor's two halves may sit on different plates)
const pieceCache = new Map();
function pieceByName(name, fl) {
  const [n, h] = name.split('-').map(Number);
  const key = packKey() + '|' + n + '|' + PR.labels;
  let P = pieceCache.get(key);
  if (!P) {
    P = piecesFor(n - 1, fl);
    pieceCache.set(key, P);
    while (pieceCache.size > 8) pieceCache.delete(pieceCache.keys().next().value);
  }
  return h === 1 ? P.upper : P.lower;
}
function plateMesh(list, fl) {
  const parts = list.map(it => { const pc = pieceByName(it.name, fl); return { V: Core.placeOnPlate(pc.V, it.deg, it.dx, it.dy), F: pc.F, placed: pc.placed }; });
  let nv = 0, nf = 0;
  for (const p of parts) { nv += p.V.length; nf += p.F.length; }
  const V = new Float64Array(nv), F = new Uint32Array(nf);
  let ov = 0, of = 0;
  for (const p of parts) { V.set(p.V, ov); for (let i = 0; i < p.F.length; i++) F[of + i] = p.F[i] + ov / 3; ov += p.V.length; of += p.F.length; }

}

function showPreview(n) {

  const a = P.upper, b = P.lower;
  const off = (a.size[0] + b.size[0]) / 4 + 5;
  const V = new Float64Array(a.V.length + b.V.length);
  for (let j = 0; j < a.V.length; j += 3) { V[j] = a.V[j] - off; V[j + 1] = a.V[j + 1]; V[j + 2] = a.V[j + 2]; }
  for (let j = 0; j < b.V.length; j += 3) { const o = a.V.length + j; V[o] = b.V[j] + off; V[o + 1] = b.V[j + 1]; V[o + 2] = b.V[j + 2]; }

function bindSlider(key, nId, rId, opts = {}) {
  const n = $(nId), r = $(rId);
  const paint = () => { const p = (r.value - r.min) / (r.max - r.min) * 100; r.style.setProperty('--p', Math.max(0, Math.min(100, p)) + '%'); };
  const set = (v, from) => {
    v = +v; if (!isFinite(v)) return;
    if (opts.int) v = Math.round(v);
    if (opts.lo !== undefined) v = Math.max(opts.lo, v);
    if (opts.hi !== undefined) v = Math.min(opts.hi, v);
    S[key] = v;
    if (from !== n) n.value = v;
    if (from !== r) r.value = v;
    paint();
    opts.geom ? rebuild() : update(false);
  };
  r.addEventListener('input', () => set(r.value, r));
  n.addEventListener('change', () => set(n.value, n));
  return { sync() { n.value = S[key]; r.value = S[key]; paint(); } };
}

const STORE = {

      if (!window.indexedDB) return rej(new Error('no indexedDB'));
      const q = indexedDB.open('unitTower', 1);
      q.onupgradeneeded = () => q.result.createObjectStore('files');
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    });
    return this.db;
  },
  async op(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('files', mode); const r = fn(tx.objectStore('files')); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); }); },
  get() { return this.op('readonly', s => s.get('last')); },
  put(name, buf) { return this.op('readwrite', s => s.put({ name, buf, at: Date.now() }, 'last')); },
  del() { return this.op('readwrite', s => s.delete('last')); },

function uploadMesh() { R.upload(geo); }

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>单体塔楼生成器 · Unit Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --panel:#0b0b0c; --line:#1c1c1e; --line2:#2c2c2e;
  --t1:#f5f5f7; --t2:rgba(245,245,247,.56); --t3:rgba(245,245,247,.34);
  --accent:#ff6a3d; --r:12px;
  --font:"DM Sans",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
#app{display:flex;height:100%;gap:12px;padding:12px}
#panel{width:300px;flex:none;background:var(--panel);border:0.5px solid var(--line2);border-radius:16px;overflow-y:auto;padding:18px 18px 22px;scrollbar-width:thin;scrollbar-color:#2c2c2e transparent}
#view{position:relative;flex:1;min-width:0;background:#030303;border:0.5px solid var(--line2);border-radius:16px;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
h1{font-size:17px;font-weight:500;letter-spacing:-.01em}
.sub{color:var(--t2);font-size:12px;margin-top:4px;line-height:1.5}
.sec{margin-top:22px;padding-top:18px;border-top:0.5px solid var(--line)}
.sec h2{font-size:13px;font-weight:500;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.sec h2 span{color:var(--t3);font-weight:400;font-size:11px}
#drop{border:0.8px dashed #48484a;border-radius:10px;padding:16px 10px;text-align:center;color:var(--t2);cursor:pointer;transition:border-color .2s,background .2s;line-height:1.5}
#drop:hover,#drop.over{border-color:var(--t1);background:rgba(255,255,255,.03);color:var(--t1)}
#drop b{font-weight:500;color:var(--t1)}
.info{margin-top:10px;color:var(--t2);font-size:12px;line-height:1.7}
.info .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.row:first-of-type{margin-top:0}
.row label{color:var(--t2)}
.num{width:66px;background:transparent;border:0;color:var(--t1);font:inherit;text-align:right;padding:2px 0;border-bottom:0.5px solid transparent;outline:none;-moz-appearance:textfield}
.num:focus{border-bottom-color:var(--t2)}
.num::-webkit-inner-spin-button,.num::-webkit-outer-spin-button{-webkit-appearance:none}
.unit{color:var(--t3);margin-left:3px;font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin-top:4px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:1px;background:linear-gradient(to right,var(--t1) var(--p,50%),#3a3a3c var(--p,50%))}
input[type=range]::-moz-range-track{height:2px;border-radius:1px;background:#3a3a3c}
input[type=range]::-moz-range-progress{height:2px;background:var(--t1)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--t1);margin-top:-6px;border:0}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--t1);border:0}
.seg{display:inline-flex;background:#1c1c1e;border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;color:var(--t2);font:inherit;font-size:12px;padding:4px 10px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--t1);color:#000}
.read{color:var(--t3);font-size:11.5px;margin-top:8px;line-height:1.6}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.btn{border:0.5px solid #48484a;background:transparent;color:var(--t1);font:inherit;font-weight:500;padding:9px 0;border-radius:9px;cursor:pointer;transition:background .2s}
.btn:hover{background:rgba(255,255,255,.06)}
.btn.primary{background:var(--t1);color:#000;border-color:var(--t1)}
.btn.primary:hover{background:#fff}
.btn:disabled{opacity:.4;cursor:default}
.link{background:none;border:0;color:var(--t2);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-top:8px}
.warn{color:#ff453a}
#hud{position:absolute;left:0;right:0;bottom:16px;text-align:center;pointer-events:none}
#hud .a{font-size:13px;color:var(--t1)}
#hud .b{font-size:11.5px;color:var(--t3);margin-top:4px}
#tools{position:absolute;top:12px;right:12px;display:flex;gap:6px}
#tools button{background:rgba(28,28,30,.8);border:0.5px solid var(--line2);color:var(--t2);font:inherit;font-size:12px;padding:6px 10px;border-radius:8px;cursor:pointer}
#tools button:hover{color:var(--t1)}
#toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(28,28,30,.92);border:0.5px solid var(--line2);padding:8px 14px;border-radius:10px;font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--t2);text-align:center;padding:30px}
.hidden{display:none!important}
@media (max-width:760px){
  #app{flex-direction:column-reverse;padding:8px;gap:8px}
  #panel{width:auto;height:46%;border-radius:14px}
  #view{flex:1}
}
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <h1>单体塔楼生成器</h1>
    <p class="sub">输入一个单体 STL，按建筑测试.gh 的逻辑叠层、收腰、扭转。</p>

    <div class="sec">
      <h2>输入 <span id="fname">示例楼板</span></h2>
      <div id="drop"><b>拖入 STL 单体</b><br>或点击选择文件</div>
      <input id="file" type="file" accept=".stl,model/stl" hidden>
      <div class="info" id="info"></div>
      <div class="row"><label>单位</label>
        <div class="seg" id="segUnit"><button data-v="0.001">mm</button><button data-v="0.01">cm</button><button data-v="1">m</button></div></div>
      <div class="row"><label>竖向轴</label>
        <div class="seg" id="segUp"><button data-v="z" class="on">Z</button><button data-v="y">Y</button></div></div>
      <div><button class="link" id="btnUnit">示例单体</button> <button class="link" id="btnSample" style="margin-left:12px">示例楼板</button></div>
    </div>

    <div class="sec" id="secThick">
      <h2>加厚 <span>两侧各一半 · 自动统一法线</span></h2>
      <div class="row"><label>厚度</label><span><input class="num" id="nThick" type="number" step="0.01"><span class="unit">m</span></span></div>
      <input type="range" id="rThick" min="0.01" max="1" step="0.01">
    </div>

    <div class="sec">
      <h2>叠层</h2>
      <div class="row"><label>层数</label><span><input class="num" id="nCount" type="number" step="1"></span></div>
      <input type="range" id="rCount" min="1" max="120" step="1">
      <div class="row"><label>净高</label><span><input class="num" id="nGap" type="number" step="0.1"><span class="unit">m</span></span></div>
      <input type="range" id="rGap" min="0" max="12" step="0.1">
      <div class="read" id="readStack"></div>
    </div>

    <div class="sec">
      <h2>收腰</h2>
      <div class="row"><label>最细比例</label><span><input class="num" id="nMin" type="number" step="0.01"></span></div>
      <input type="range" id="rMin" min="0.2" max="1.5" step="0.01">
      <div class="row"><label>曲线</label>
        <div class="seg" id="segCurve"><button data-v="linear" class="on">线性</button><button data-v="smooth">平滑</button></div></div>
      <div class="read" id="readWaist"></div>
    </div>

    <div class="sec">
      <h2>扭转</h2>
      <div class="row"><label>每层角度</label><span><input class="num" id="nRot" type="number" step="0.5"><span class="unit">°</span></span></div>
      <input type="range" id="rRot" min="-90" max="90" step="0.5">
      <div class="row"><label>基点</label>
        <div class="seg" id="segPivot"><button data-v="centroid" class="on">质心</button><button data-v="bbox">包围盒中心</button></div></div>
      <div class="read" id="readTwist"></div>
    </div>

    <div class="sec" id="secPrint">
      <h2>打印分件 <span>Bambu Lab A1 · 256 mm</span></h2>
      <div class="row"><label>比例</label>
        <div class="seg" id="segScale"><button data-v="300">1:300</button><button data-v="500" class="on">1:500</button><button data-v="750">1:750</button><button data-v="1000">1:1000</button></div></div>
      <div class="row"><label>打印壁厚</label><span><input class="num" id="nWall" type="number" step="0.1"><span class="unit">mm</span></span></div>
      <input type="range" id="rWall" min="0.4" max="3" step="0.1">
      <div class="row"><label>层号</label>
        <div class="seg" id="segLabel"><button data-v="1" class="on">压凸字</button><button data-v="0">不压</button></div></div>
      <div class="read" id="readPrint"></div>
      <div class="row"><label>预览第</label><span><input class="num" id="nPrev" type="number" step="1" value="1" style="width:40px"><span class="unit">层分件</span></span></div>
      <div class="btns" style="grid-template-columns:1fr 1fr;margin-top:12px">
        <button class="btn" id="btnPrev">预览分件</button>
        <button class="btn primary" id="btnPrint">导出 ZIP</button>
      </div>
    </div>

    <div class="sec">
      <h2>导出 <span id="expInfo"></span></h2>
      <div class="btns">
        <button class="btn primary" id="exSTL">STL</button>
        <button class="btn" id="exOBJ">OBJ</button>
        <button class="btn" id="ex3DM">3DM</button>
      </div>
      <div class="read" id="readExport">导出使用原文件单位；OBJ 与 3DM 每层一个独立物件。</div>
      <button class="link" id="btnReset">恢复 gh 默认参数</button>
    </div>
  </aside>

  <main id="view">
    <canvas id="gl"></canvas>
    <div id="tools"><button id="btnFit">重置视角</button></div>
    <div id="toast"></div>
    <div id="hud"><div class="a" id="hudA"></div><div class="b">拖动旋转 · 右键或 Shift 平移 · 滚轮缩放</div></div>
    <div id="err"></div>
  </main>
</div>

<script>
// ===================== CORE-BEGIN (pure geometry, no DOM) =====================
const Core = (() => {
  function parseSTL(buf) {
    const dv = new DataView(buf);
    const bytes = new Uint8Array(buf);
    let isBinary = false;
    if (buf.byteLength >= 84) {
      const n = dv.getUint32(80, true);
      if (84 + n * 50 === buf.byteLength) isBinary = true;
    }
    if (!isBinary) {
      const head = new TextDecoder().decode(bytes.subarray(0, Math.min(1024, bytes.length))).toLowerCase();
      if (!(head.trimStart().startsWith('solid') && head.includes('facet'))) {
        if (buf.byteLength >= 84) isBinary = true;
      }
    }
    if (isBinary) {
      const n = Math.min(dv.getUint32(80, true), Math.floor((buf.byteLength - 84) / 50));
      const pos = new Float32Array(n * 9);
      for (let i = 0; i < n; i++) {
        const o = 84 + i * 50 + 12;
        for (let k = 0; k < 9; k++) pos[i * 9 + k] = dv.getFloat32(o + k * 4, true);
      }
      return pos;
    }
    const text = new TextDecoder().decode(bytes);
    const re = /vertex\s+([-+\d.eE]+)\s+([-+\d.eE]+)\s+([-+\d.eE]+)/g;
    const out = [];
    let m;
    while ((m = re.exec(text))) out.push(+m[1], +m[2], +m[3]);
    const usable = out.length - (out.length % 9);
    return new Float32Array(out.slice(0, usable));
  }

  function bbox(V) {
    const mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
    for (let i = 0; i < V.length; i += 3)
      for (let k = 0; k < 3; k++) { const v = V[i + k]; if (v < mn[k]) mn[k] = v; if (v > mx[k]) mx[k] = v; }
    return { min: mn, max: mx, size: [mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2]] };
  }

  // triangle soup -> indexed mesh, dropping degenerate triangles
  function weld(pos, upY) {
    const P = new Float64Array(pos.length);
    for (let i = 0; i < pos.length; i += 3) {
      if (upY) { P[i] = pos[i]; P[i + 1] = -pos[i + 2]; P[i + 2] = pos[i + 1]; }
      else { P[i] = pos[i]; P[i + 1] = pos[i + 1]; P[i + 2] = pos[i + 2]; }
    }
    const bb = bbox(P);
    const diag = Math.hypot(...bb.size) || 1;
    const tol = diag * 1e-7;
    const map = new Map();
    const V = [];
    const idx = new Uint32Array(P.length / 3);
    for (let i = 0; i < P.length / 3; i++) {
      const x = P[i * 3], y = P[i * 3 + 1], z = P[i * 3 + 2];
      const key = Math.round(x / tol) + ',' + Math.round(y / tol) + ',' + Math.round(z / tol);
      let id = map.get(key);
      if (id === undefined) { id = V.length / 3; map.set(key, id); V.push(x, y, z); }
      idx[i] = id;
    }
    const F = [];
    for (let t = 0; t < idx.length; t += 3) {
      const a = idx[t], b = idx[t + 1], c = idx[t + 2];
      if (a !== b && b !== c && a !== c) F.push(a, b, c);
    }
    return { V: new Float64Array(V), F: new Uint32Array(F) };
  }

  function edgeStats(F, nv) {
    const cnt = new Map();
    const dir = new Map();
    for (let t = 0; t < F.length; t += 3) {
      for (let e = 0; e < 3; e++) {
        const a = F[t + e], b = F[t + (e + 1) % 3];
        const key = a < b ? a * nv + b : b * nv + a;
        cnt.set(key, (cnt.get(key) || 0) + 1);
        dir.set(key, [a, b]);
      }
    }
    const boundary = [];
    let nonManifold = 0;
    for (const [k, c] of cnt) {
      if (c === 1) boundary.push(dir.get(k));
      else if (c > 2) nonManifold++;
    }
    return { closed: boundary.length === 0 && nonManifold === 0, boundary, nonManifold, edges: cnt.size };
  }

  function volumeCentroid(V, F) {
    let vol = 0, cx = 0, cy = 0, cz = 0;
    for (let t = 0; t < F.length; t += 3) {
      const a = F[t] * 3, b = F[t + 1] * 3, c = F[t + 2] * 3;
      const ax = V[a], ay = V[a + 1], az = V[a + 2];
      const bx = V[b], by = V[b + 1], bz = V[b + 2];
      const qx = V[c], qy = V[c + 1], qz = V[c + 2];
      const v = (ax * (by * qz - bz * qy) - ay * (bx * qz - bz * qx) + az * (bx * qy - by * qx)) / 6;
      vol += v; cx += v * (ax + bx + qx) / 4; cy += v * (ay + by + qy) / 4; cz += v * (az + bz + qz) / 4;
    }
    return { vol, c: vol !== 0 ? [cx / vol, cy / vol, cz / vol] : null };
  }

  function areaCentroid(V, F) {
    let A = 0, cx = 0, cy = 0, cz = 0;
    for (let t = 0; t < F.length; t += 3) {
      const a = F[t] * 3, b = F[t + 1] * 3, c = F[t + 2] * 3;
      const ux = V[b] - V[a], uy = V[b + 1] - V[a + 1], uz = V[b + 2] - V[a + 2];
      const wx = V[c] - V[a], wy = V[c + 1] - V[a + 1], wz = V[c + 2] - V[a + 2];
      const ar = Math.hypot(uy * wz - uz * wy, uz * wx - ux * wz, ux * wy - uy * wx) / 2;
      A += ar;
      cx += ar * (V[a] + V[b] + V[c]) / 3; cy += ar * (V[a + 1] + V[b + 1] + V[c + 1]) / 3; cz += ar * (V[a + 2] + V[b + 2] + V[c + 2]) / 3;
    }
    return { area: A, c: A > 0 ? [cx / A, cy / A, cz / A] : [0, 0, 0] };
  }

  function vertexNormals(V, F) {
    const N = new Float64Array(V.length);
    for (let t = 0; t < F.length; t += 3) {
      const a = F[t] * 3, b = F[t + 1] * 3, c = F[t + 2] * 3;
      const ux = V[b] - V[a], uy = V[b + 1] - V[a + 1], uz = V[b + 2] - V[a + 2];
      const wx = V[c] - V[a], wy = V[c + 1] - V[a + 1], wz = V[c + 2] - V[a + 2];
      const nx = uy * wz - uz * wy, ny = uz * wx - ux * wz, nz = ux * wy - uy * wx;
      for (const i of [a, b, c]) { N[i] += nx; N[i + 1] += ny; N[i + 2] += nz; }
    }
    for (let i = 0; i < N.length; i += 3) {
      const l = Math.hypot(N[i], N[i + 1], N[i + 2]) || 1;
      N[i] /= l; N[i + 1] /= l; N[i + 2] /= l;
    }
    return N;
  }

  // ---- unify normals + two-sided shell (works for non-orientable patch assemblies) ----
  function faceNormals(V, F) {
    const nf = F.length / 3, N = new Float64Array(nf * 3), A = new Float64Array(nf);
    for (let f = 0; f < nf; f++) {
      const a = F[f * 3] * 3, b = F[f * 3 + 1] * 3, c = F[f * 3 + 2] * 3;
      const ux = V[b] - V[a], uy = V[b + 1] - V[a + 1], uz = V[b + 2] - V[a + 2];
      const wx = V[c] - V[a], wy = V[c + 1] - V[a + 1], wz = V[c + 2] - V[a + 2];
      const nx = uy * wz - uz * wy, ny = uz * wx - ux * wz, nz = ux * wy - uy * wx;
      const l = Math.hypot(nx, ny, nz) || 1;
      N[f * 3] = nx / l; N[f * 3 + 1] = ny / l; N[f * 3 + 2] = nz / l; A[f] = l / 2;
    }
    return { N, A };
  }
  // edge -> [face, startVertex, face, startVertex, ...]
  function edgeFaces(F, nv) {
    const m = new Map();
    for (let f = 0; f < F.length / 3; f++)
      for (let e = 0; e < 3; e++) {
        const a = F[f * 3 + e], b = F[f * 3 + (e + 1) % 3];
        const k = a < b ? a * nv + b : b * nv + a;
        let l = m.get(k); if (!l) m.set(k, l = []);
        l.push(f, a, e);
      }
    return m;
  }

  // like Rhino UnifyMeshNormals, but crossing the smoothest edges first, so that edges that can
  // never agree (twisted assemblies) end up where the surface turns over rather than mid-panel
  function unifyNormals(V, F) {
    const nv = V.length / 3, nf = F.length / 3;
    const { N } = faceNormals(V, F);
    const em = edgeFaces(F, nv);
    const deg = new Uint32Array(nf + 1);
    for (const l of em.values()) if (l.length === 6) { deg[l[0] + 1]++; deg[l[3] + 1]++; }
    for (let i = 0; i < nf; i++) deg[i + 1] += deg[i];
    const nbF = new Uint32Array(deg[nf]), nbS = new Uint8Array(deg[nf]), nbQ = new Float32Array(deg[nf]);
    const fill = deg.slice(0, nf);
    for (const l of em.values()) if (l.length === 6) {
      const f = l[0], g = l[3], s = l[1] === l[4] ? 1 : 0;
      const q = Math.abs(N[f * 3] * N[g * 3] + N[f * 3 + 1] * N[g * 3 + 1] + N[f * 3 + 2] * N[g * 3 + 2]);
      let i = fill[f]++; nbF[i] = g; nbS[i] = s; nbQ[i] = q;
      i = fill[g]++; nbF[i] = f; nbS[i] = s; nbQ[i] = q;
    }
    const flip = new Int8Array(nf).fill(-1);
    const hq = [], hf = [], hg = [], hs = [];
    const push = (q, f, g, s) => {
      let i = hq.length; hq.push(q); hf.push(f); hg.push(g); hs.push(s);
      while (i > 0) { const p = (i - 1) >> 1; if (hq[p] >= hq[i]) break; swap(p, i); i = p; }
    };
    const swap = (i, j) => { let t = hq[i]; hq[i] = hq[j]; hq[j] = t; t = hf[i]; hf[i] = hf[j]; hf[j] = t; t = hg[i]; hg[i] = hg[j]; hg[j] = t; t = hs[i]; hs[i] = hs[j]; hs[j] = t; };
    const pop = () => {
      const r = [hf[0], hg[0], hs[0]];
      const last = hq.length - 1; swap(0, last); hq.pop(); hf.pop(); hg.pop(); hs.pop();
      let i = 0;
      for (;;) { const a = 2 * i + 1, b = a + 1; let m = i; if (a < hq.length && hq[a] > hq[m]) m = a; if (b < hq.length && hq[b] > hq[m]) m = b; if (m === i) break; swap(m, i); i = m; }
      return r;
    };
    // seed each connected patch with its largest-area-agreeing start: keep the majority orientation
    for (let s0 = 0; s0 < nf; s0++) {
      if (flip[s0] >= 0) continue;
      flip[s0] = 0;
      const members = [s0];
      for (let i = deg[s0]; i < deg[s0 + 1]; i++) push(nbQ[i], s0, nbF[i], nbS[i]);
      while (hq.length) {
        const [f, g, s] = pop();
        if (flip[g] >= 0) continue;
        flip[g] = flip[f] ^ s; members.push(g);
        for (let i = deg[g]; i < deg[g + 1]; i++) if (flip[nbF[i]] < 0) push(nbQ[i], g, nbF[i], nbS[i]);
      }
      let k = 0; for (const f of members) k += flip[f];
      if (k * 2 > members.length) for (const f of members) flip[f] ^= 1;
    }
    const F2 = new Uint32Array(F);
    let flipped = 0;
    for (let f = 0; f < nf; f++) if (flip[f]) { flipped++; const t = F2[f * 3 + 1]; F2[f * 3 + 1] = F2[f * 3 + 2]; F2[f * 3 + 2] = t; }
    let before = 0;
    for (const l of em.values()) if (l.length === 6 && l[1] === l[4]) before++;
    return { F: F2, flipped, before };
  }

  // two-sided thickening (total t, t/2 each side) of a unified mesh. Where the orientation cannot
  // agree ("twist" edges) the sheet is cut, and top/bottom of the two sides are stitched crosswise,
  // so the shell stays closed and continuous.
  function shell(V, F0, t) {
    const nv = V.length / 3;
    const u = unifyNormals(V, F0);
    const F = u.F, nf = F.length / 3;
    const { N, A } = faceNormals(V, F);
    const em = edgeFaces(F, nv);
    // corners (face*3+k) -> vertex copies; join corners across smooth, agreeing edges
    const P = new Int32Array(nf * 3); for (let i = 0; i < P.length; i++) P[i] = i;
    const find = x => { while (P[x] !== x) { P[x] = P[P[x]]; x = P[x]; } return x; };
    const join = (a, b) => { a = find(a); b = find(b); if (a !== b) P[a] = b; };
    const corner = (f, v) => f * 3 + (F[f * 3] === v ? 0 : F[f * 3 + 1] === v ? 1 : 2);
    const twist = [];
    const open = [];
    for (const l of em.values()) {
      if (l.length === 6) {
        const f = l[0], g = l[3], a = l[1], b = F[f * 3 + (l[2] + 1) % 3];
        if (l[1] !== l[4]) { join(corner(f, a), corner(g, a)); join(corner(f, b), corner(g, b)); }
        else twist.push(f, g, a, b);
      } else for (let i = 0; i < l.length; i += 3) open.push(l[i], l[i + 2]);
    }
    // copies related across twist edges, with parity (opposite sides)
    const Q = new Int32Array(nf * 3), R = new Uint8Array(nf * 3);
    for (let i = 0; i < Q.length; i++) Q[i] = i;
    const findQ = x => { let p = 0; const path = []; while (Q[x] !== x) { path.push(x); p ^= R[x]; x = Q[x]; } let acc = p; for (const y of path) { const r = R[y]; Q[y] = x; R[y] = acc; acc ^= r; } return [x, p]; };
    const joinQ = (a, b, par) => { const [ra, pa] = findQ(a), [rb, pb] = findQ(b); if (ra !== rb) { Q[ra] = rb; R[ra] = pa ^ pb ^ par; } };
    for (let i = 0; i < twist.length; i += 4) {
      const [f, g, a, b] = [twist[i], twist[i + 1], twist[i + 2], twist[i + 3]];
      joinQ(find(corner(f, a)), find(corner(g, a)), 1);
      joinQ(find(corner(f, b)), find(corner(g, b)), 1);
    }
    // normal per cluster (sum of face normals, sign by side)
    const acc = new Map();
    const vOf = new Int32Array(nf * 3);
    for (let c = 0; c < nf * 3; c++) {
      const f = (c / 3) | 0, g = find(c);
      const [root, par] = findQ(g);
      vOf[c] = F[c];
      let e = acc.get(root); if (!e) acc.set(root, e = [0, 0, 0, F[c]]);
      const sg = par ? -1 : 1, w = A[f];
      e[0] += sg * N[f * 3] * w; e[1] += sg * N[f * 3 + 1] * w; e[2] += sg * N[f * 3 + 2] * w;
    }
    const outV = [];
    const idx = new Map();
    for (const [root, e] of acc) {
      const v = e[3] * 3;
      let l = Math.hypot(e[0], e[1], e[2]);
      let nx = e[0], ny = e[1], nz = e[2];
      if (l < 1e-12) { nx = 0; ny = 0; nz = 1; l = 1; }
      const h = t / 2 / l;
      const i = outV.length / 3;
      outV.push(V[v] + nx * h, V[v + 1] + ny * h, V[v + 2] + nz * h, V[v] - nx * h, V[v + 1] - ny * h, V[v + 2] - nz * h);
      idx.set(root, i);
    }
    const top = c => { const [root, par] = findQ(find(c)); return idx.get(root) + par; };
    const bot = c => { const [root, par] = findQ(find(c)); return idx.get(root) + 1 - par; };
    const out = [];
    for (let f = 0; f < nf; f++) {
      const c = f * 3;
      out.push(top(c), top(c + 1), top(c + 2), bot(c), bot(c + 2), bot(c + 1));
    }
    for (let i = 0; i < open.length; i += 2) {
      const f = open[i], e = open[i + 1];
      const ca = f * 3 + e, cb = f * 3 + (e + 1) % 3;
      out.push(bot(ca), bot(cb), top(cb), bot(ca), top(cb), top(ca));
    }
    const Vo = new Float64Array(outV), Fo = new Uint32Array(out);
    if (volumeCentroid(Vo, Fo).vol < 0) for (let k = 0; k < Fo.length; k += 3) { const x = Fo[k + 1]; Fo[k + 1] = Fo[k + 2]; Fo[k + 2] = x; }
    return { V: Vo, F: Fo, flipped: u.flipped, before: u.before, twist: twist.length / 4 };
  }

  // per-floor scale factors; for an even floor count this equals the gh
  // (Series 1, -step, n/2) + Reverse + Merge exactly
  function profile(n, minR, curve) {
    const s = new Float64Array(n);
    const kmax = Math.floor((n - 1) / 2);
    for (let i = 0; i < n; i++) {
      if (kmax === 0) { s[i] = 1; continue; }
      const u = Math.min(i, n - 1 - i) / kmax;
      s[i] = curve === 'smooth' ? 1 - (1 - minR) * (1 - Math.cos(Math.PI * u)) / 2 : 1 - (1 - minR) * u;
    }
    return s;
  }

  function floors(p) {
    const s = profile(p.count, p.minR, p.curve);
    const out = [];
    for (let i = 0; i < p.count; i++) out.push({ i, z: i * p.pitch, s: s[i], th: i * p.stepDeg * Math.PI / 180 });
    return out;
  }

  // world position of a base vertex on floor f (scale XY then rotate about the vertical axis through c)
  function xf(x, y, z, c, f) {
    const dx = (x - c[0]) * f.s, dy = (y - c[1]) * f.s;
    const cs = Math.cos(f.th), sn = Math.sin(f.th);
    return [c[0] + cs * dx - sn * dy, c[1] + sn * dx + cs * dy, z + f.z];
  }

  function exportSTL(V, F, c, fl, k) {
    const nt = F.length / 3;
    const buf = new ArrayBuffer(84 + nt * fl.length * 50);
    const dv = new DataView(buf);
    const hdr = 'Unit Tower generator (gh logic) ' + fl.length + ' floors';
    for (let i = 0; i < Math.min(80, hdr.length); i++) dv.setUint8(i, hdr.charCodeAt(i) & 127);
    dv.setUint32(80, nt * fl.length, true);
    let o = 84;
    const nv = V.length / 3;
    const W = new Float64Array(nv * 3);
    for (const f of fl) {
      for (let v = 0; v < nv; v++) {
        const q = xf(V[v * 3], V[v * 3 + 1], V[v * 3 + 2], c, f);
        W[v * 3] = q[0] * k; W[v * 3 + 1] = q[1] * k; W[v * 3 + 2] = q[2] * k;
      }
      for (let t = 0; t < F.length; t += 3) {
        const a = F[t] * 3, b = F[t + 1] * 3, d = F[t + 2] * 3;
        const ux = W[b] - W[a], uy = W[b + 1] - W[a + 1], uz = W[b + 2] - W[a + 2];
        const wx = W[d] - W[a], wy = W[d + 1] - W[a + 1], wz = W[d + 2] - W[a + 2];
        let nx = uy * wz - uz * wy, ny = uz * wx - ux * wz, nz = ux * wy - uy * wx;
        const l = Math.hypot(nx, ny, nz) || 1;
        dv.setFloat32(o, nx / l, true); dv.setFloat32(o + 4, ny / l, true); dv.setFloat32(o + 8, nz / l, true);
        o += 12;
        for (const i of [a, b, d]) {
          dv.setFloat32(o, W[i], true); dv.setFloat32(o + 4, W[i + 1], true); dv.setFloat32(o + 8, W[i + 2], true);
          o += 12;
        }
        o += 2;
      }
    }
    return buf;
  }

  function exportOBJ(V, F, c, fl, k) {
    const nv = V.length / 3;
    const parts = ['# Unit Tower generator (gh logic), ' + fl.length + ' floors\n'];
    let base = 0;
    for (const f of fl) {
      const L = ['o floor_' + String(f.i + 1).padStart(3, '0')];
      for (let v = 0; v < nv; v++) {
        const q = xf(V[v * 3], V[v * 3 + 1], V[v * 3 + 2], c, f);
        L.push('v ' + +(q[0] * k).toFixed(6) + ' ' + +(q[1] * k).toFixed(6) + ' ' + +(q[2] * k).toFixed(6));
      }
      for (let t = 0; t < F.length; t += 3) L.push('f ' + (F[t] + 1 + base) + ' ' + (F[t + 1] + 1 + base) + ' ' + (F[t + 2] + 1 + base));
      base += nv;
      parts.push(L.join('\n') + '\n');
    }
    return parts.join('');
  }

  // rhino: an initialised rhino3dm module
  function export3DM(rhino, V, F, c, fl, k, unitName) {
    const doc = new rhino.File3dm();
    try { doc.settings().modelUnitSystem = rhino.UnitSystem[unitName]; } catch (e) {}
    let layerIndex = 0;
    try {
      const layer = new rhino.Layer();
      layer.name = 'Unit Tower';
      doc.layers().add(layer);
    } catch (e) {}
    const nv = V.length / 3;
    for (const f of fl) {
      const mesh = new rhino.Mesh();
      const vs = mesh.vertices(), fs = mesh.faces();
      for (let v = 0; v < nv; v++) {
        const q = xf(V[v * 3], V[v * 3 + 1], V[v * 3 + 2], c, f);
        vs.add(q[0] * k, q[1] * k, q[2] * k);
      }
      for (let t = 0; t < F.length; t += 3) fs.addTriFace(F[t], F[t + 1], F[t + 2]);
      try { mesh.normals().computeNormals(); mesh.compact(); } catch (e) {}
      const att = new rhino.ObjectAttributes();
      att.layerIndex = layerIndex;
      att.name = 'F' + String(f.i + 1).padStart(2, '0');
      doc.objects().add(mesh, att);
    }
    return doc.toByteArray();
  }

  // sample: rounded-rectangle floor plate, open surface (the gh thickens it by 0.1)
  function samplePlate(w = 30, d = 18, r = 4, seg = 10) {
    const pts = [];
    const cs = [[w / 2 - r, d / 2 - r, 0], [-w / 2 + r, d / 2 - r, 90], [-w / 2 + r, -d / 2 + r, 180], [w / 2 - r, -d / 2 + r, 270]];
    for (const [cx, cy, a0] of cs)
      for (let j = 0; j <= seg; j++) {
        const a = (a0 + 90 * j / seg) * Math.PI / 180;
        pts.push(cx + r * Math.cos(a), cy + r * Math.sin(a));
      }
    const m = pts.length / 2;
    const tri = [];
    for (let i = 0; i < m; i++) {
      const j = (i + 1) % m;
      tri.push(0, 0, 0, pts[i * 2], pts[i * 2 + 1], 0, pts[j * 2], pts[j * 2 + 1], 0);
    }
    return new Float32Array(tri);
  }

  // ---------------- print parts (cut each floor in half, constant wall, labels) ----------------
  // split an open surface at z = zc into two triangle soups, sharing the exact cut points
  function cutZ(V, F, zc) {
    const nv = V.length / 3;
    const bb = bbox(V);
    const eps = (Math.hypot(...bb.size) || 1) * 1e-7;
    const d = new Float64Array(nv);
    for (let i = 0; i < nv; i++) { const v = V[i * 3 + 2] - zc; d[i] = Math.abs(v) < eps ? eps : v; }
    const P = i => [V[i * 3], V[i * 3 + 1], V[i * 3 + 2]];
    const cutP = (a, b) => {
      const lo = Math.min(a, b), hi = Math.max(a, b), t = d[lo] / (d[lo] - d[hi]);
      return [V[lo * 3] + (V[hi * 3] - V[lo * 3]) * t, V[lo * 3 + 1] + (V[hi * 3 + 1] - V[lo * 3 + 1]) * t, zc];
    };
    const out = [[], []];
    const tri = (h, p, q, r) => out[h].push(...p, ...q, ...r);
    for (let t = 0; t < F.length; t += 3) {
      const ids = [F[t], F[t + 1], F[t + 2]];
      const s = ids.map(i => d[i] > 0 ? 1 : 0);
      if (s[0] === s[1] && s[1] === s[2]) { tri(s[0], P(ids[0]), P(ids[1]), P(ids[2])); continue; }
      let k = s[0] !== s[1] && s[0] !== s[2] ? 0 : s[1] !== s[0] && s[1] !== s[2] ? 1 : 2;
      const p = ids[k], q = ids[(k + 1) % 3], r = ids[(k + 2) % 3];
      const P1 = cutP(p, q), P2 = cutP(p, r);
      tri(s[k], P(p), P1, P2);
      tri(1 - s[k], P1, P(q), P(r));
      tri(1 - s[k], P1, P(r), P2);
    }
    return { lo: weld(new Float32Array(out[0]), false), hi: weld(new Float32Array(out[1]), false) };
  }

  function boxTris(x0, y0, z0, x1, y1, z1, V, F) {
    const b = V.length / 3;
    V.push(x0, y0, z0, x1, y0, z0, x1, y1, z0, x0, y1, z0, x0, y0, z1, x1, y0, z1, x1, y1, z1, x0, y1, z1);
    const q = [[0, 2, 1], [0, 3, 2], [4, 5, 6], [4, 6, 7], [0, 1, 5], [0, 5, 4], [1, 2, 6], [1, 6, 5], [2, 3, 7], [2, 7, 6], [3, 0, 4], [3, 4, 7]];
    for (const [i, j, k] of q) F.push(b + i, b + j, b + k);
  }
  const SEG = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg', '-': 'g' };
  // 7-segment text as raised boxes; returns rectangles in (u,v) text space
  function glyphRects(text, W, H, bar, gap) {
    const R = [];
    let u = 0;
    for (const ch of text) {
      const segs = SEG[ch] || '';
      const S = {
        a: [0, H - bar, W, H], d: [0, 0, W, bar], g: [0, (H - bar) / 2, W, (H + bar) / 2],
        f: [0, H / 2 - bar / 2, bar, H], b: [W - bar, H / 2 - bar / 2, W, H], e: [0, 0, bar, H / 2 + bar / 2], c: [W - bar, 0, W, H / 2 + bar / 2],
      };
      for (const s of segs) { const r = S[s]; R.push([u + r[0], r[1], u + r[2], r[3]]); }
      u += W + gap;
    }
    return { R, width: u - gap, height: H };
  }

  // find a flat, upward-facing interior floor (the trough bottom) big enough for the label
  function findLabelSpot(V, F, wall, wTxt, hTxt) {
    const cand = [];
    const hist = new Map();
    for (let t = 0; t < F.length; t += 3) {
      const a = F[t] * 3, b = F[t + 1] * 3, c = F[t + 2] * 3;
      const ux = V[b] - V[a], uy = V[b + 1] - V[a + 1], uz = V[b + 2] - V[a + 2];
      const wx = V[c] - V[a], wy = V[c + 1] - V[a + 1], wz = V[c + 2] - V[a + 2];
      const nx = uy * wz - uz * wy, ny = uz * wx - ux * wz, nz = ux * wy - uy * wx;
      const l = Math.hypot(nx, ny, nz); if (!l || nz / l < 0.985) continue;
      const z = (V[a + 2] + V[b + 2] + V[c + 2]) / 3;
      if (z < wall * 0.3) continue;
      cand.push(t, z);
      const key = Math.round(z / (wall * 0.25));
      hist.set(key, (hist.get(key) || 0) + l / 2);
    }
    if (!cand.length) return null;
    let bestKey = null, bestA = 0;
    for (const [k, A] of hist) if (A > bestA || (A === bestA && k < bestKey)) { bestA = A; bestKey = k; }
    const zf = bestKey * wall * 0.25;
    const bb = bbox(V);
    const cell = 0.5;
    const nx = Math.ceil(bb.size[0] / cell) + 1, ny = Math.ceil(bb.size[1] / cell) + 1;
    const G = new Uint8Array(nx * ny), Z = new Float32Array(nx * ny);
    for (let i = 0; i < cand.length; i += 2) {
      const t = cand[i], z = cand[i + 1];
      if (Math.abs(z - zf) > wall * 0.3) continue;
      const p = [0, 1, 2].map(k => [V[F[t + k] * 3], V[F[t + k] * 3 + 1]]);
      const x0 = Math.min(p[0][0], p[1][0], p[2][0]), x1 = Math.max(p[0][0], p[1][0], p[2][0]);
      const y0 = Math.min(p[0][1], p[1][1], p[2][1]), y1 = Math.max(p[0][1], p[1][1], p[2][1]);
      const i0 = Math.max(0, Math.floor((x0 - bb.min[0]) / cell)), i1 = Math.min(nx - 1, Math.ceil((x1 - bb.min[0]) / cell));
      const j0 = Math.max(0, Math.floor((y0 - bb.min[1]) / cell)), j1 = Math.min(ny - 1, Math.ceil((y1 - bb.min[1]) / cell));
      const area = (p[1][0] - p[0][0]) * (p[2][1] - p[0][1]) - (p[2][0] - p[0][0]) * (p[1][1] - p[0][1]);
      for (let j = j0; j <= j1; j++) for (let i2 = i0; i2 <= i1; i2++) {
        const x = bb.min[0] + (i2 + 0.5) * cell, y = bb.min[1] + (j + 0.5) * cell;
        const w0 = (p[1][0] - x) * (p[2][1] - y) - (p[2][0] - x) * (p[1][1] - y);
        const w1 = (p[2][0] - x) * (p[0][1] - y) - (p[0][0] - x) * (p[2][1] - y);
        const w2 = area - w0 - w1;
        if (area > 0 ? (w0 >= 0 && w1 >= 0 && w2 >= 0) : (w0 <= 0 && w1 <= 0 && w2 <= 0)) { G[j * nx + i2] = 1; Z[j * nx + i2] = z; }
      }
    }
    const I = new Int32Array((nx + 1) * (ny + 1));
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++)
      I[(j + 1) * (nx + 1) + i + 1] = G[j * nx + i] + I[j * (nx + 1) + i + 1] + I[(j + 1) * (nx + 1) + i] - I[j * (nx + 1) + i];
    const full = (i, j, w, h) => I[(j + h) * (nx + 1) + i + w] - I[j * (nx + 1) + i + w] - I[(j + h) * (nx + 1) + i] + I[j * (nx + 1) + i] === w * h;
    const cx = (bb.min[0] + bb.max[0]) / 2, cy = (bb.min[1] + bb.max[1]) / 2;
    let best = null;
    for (const along of ['x', 'y']) {
      const w = Math.ceil((along === 'x' ? wTxt : hTxt) / cell), h = Math.ceil((along === 'x' ? hTxt : wTxt) / cell);
      for (let j = 0; j + h <= ny; j++) for (let i = 0; i + w <= nx; i++) {
        if (!full(i, j, w, h)) continue;
        const x = bb.min[0] + (i + w / 2) * cell, y = bb.min[1] + (j + h / 2) * cell;
        const score = Math.hypot(x - cx, y - cy);
        if (!best || score > best.score) best = { score, x, y, along, z: Z[(j + (h >> 1)) * nx + i + (w >> 1)] };
      }
    }
    return best;
  }

  function addLabel(V, F, text, wall, size) {
    for (const sc of [1, 0.75, 0.55]) {
      const H = size * sc, W = H * 0.6, bar = Math.max(0.6, H * 0.16), gap = H * 0.2, m = 1;
      const g = glyphRects(text, W, H, bar, gap);
      const spot = findLabelSpot(V, F, wall, g.width + 2 * m, g.height + 2 * m);
      if (!spot) continue;
      const Vn = Array.from(V), Fn = Array.from(F);
      const z0 = spot.z - 0.3, z1 = spot.z + 0.6;
      for (const [u0, v0, u1, v1] of g.R) {
        const uc = u0 - g.width / 2, uc1 = u1 - g.width / 2, vc = v0 - g.height / 2, vc1 = v1 - g.height / 2;
        if (spot.along === 'x') boxTris(spot.x + uc, spot.y + vc, z0, spot.x + uc1, spot.y + vc1, z1, Vn, Fn);
        else boxTris(spot.x - vc1, spot.y + uc, z0, spot.x - vc, spot.y + uc1, z1, Vn, Fn);
      }
      return { V: new Float64Array(Vn), F: new Uint32Array(Fn), placed: true, size: H };
    }
    return { V, F, placed: false };
  }

  // one floor -> two printable halves in mm, flat side down, centred on the origin
  // halves: result of cutZ on the unit surface (file units); k = mm per file unit
  function printPieces(halves, c, s, k, wallMM, floorNo, labels, labelMM) {
    const res = {};
    for (const [key, part, flip, tag] of [['upper', halves.hi, true, '-1'], ['lower', halves.lo, false, '-2']]) {
      const V = part.V, n = V.length / 3;
      const Vs = new Float64Array(V.length);
      for (let i = 0; i < n; i++) {
        Vs[i * 3] = c[0] + (V[i * 3] - c[0]) * s;
        Vs[i * 3 + 1] = c[1] + (V[i * 3 + 1] - c[1]) * s;
        Vs[i * 3 + 2] = V[i * 3 + 2];
      }
      const sh = shell(Vs, part.F, wallMM / k);
      const W = new Float64Array(sh.V.length);
      for (let i = 0; i < sh.V.length; i += 3) {
        const x = sh.V[i] * k, y = sh.V[i + 1] * k, z = sh.V[i + 2] * k;
        W[i] = x; W[i + 1] = flip ? -y : y; W[i + 2] = flip ? -z : z;
      }
      const bb = bbox(W);
      for (let i = 0; i < W.length; i += 3) { W[i] -= (bb.min[0] + bb.max[0]) / 2; W[i + 1] -= (bb.min[1] + bb.max[1]) / 2; W[i + 2] -= bb.min[2]; }

      out.size = bbox(out.V).size;

    }
    return res;
  }

  // ---------- zip (deflate when CompressionStream exists, else stored) ----------
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    const DATE = (2026 - 1980) << 9 | 11 << 5 | 25;

      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, e.method, true);
      h.setUint16(10, 0, true); h.setUint16(12, DATE, true); h.setUint32(14, e.crc, true); h.setUint32(18, e.body.length, true);
      h.setUint32(22, e.usize, true); h.setUint16(26, e.nb.length, true); h.setUint16(28, 0, true);
      parts.push(h.buffer, e.nb, e.body);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
      c.setUint16(10, e.method, true); c.setUint16(12, 0, true); c.setUint16(14, DATE, true); c.setUint32(16, e.crc, true);
      c.setUint32(20, e.body.length, true); c.setUint32(24, e.usize, true); c.setUint16(28, e.nb.length, true);
      c.setUint32(42, off, true);

    t.push(`<text x="${pad}" y="48" fill="#F5F5F7" font-size="24" font-weight="500">${title} · 组装图</text>`);
    t.push(`<text x="${pad}" y="78" fill="#8E8E93" font-size="14">1:${scaleDen} · 打印壁厚 ${wall} mm · 每层两片：N-1 上半（翻面打印，组装时翻回）、N-2 下半 · 从下往上按层号粘合</text>`);
    t.push(`<text x="${pad}" y="100" fill="#8E8E93" font-size="14">角度为相对第 1 层逆时针旋转（俯视），橙线为第 1 层的十字臂方向</text>`);
    fl.forEach((f, i) => {
      const x = pad + (i % cols) * cw, y = top + Math.floor(i / cols) * ch;
      const cx = x + cw / 2, cy = y + 62, a = f.angle % 360;
      t.push(`<rect x="${x + 4}" y="${y + 4}" width="${cw - 8}" height="${ch - 8}" rx="10" fill="#0B0B0C" stroke="#2C2C2E"/>`);
      t.push(`<line x1="${cx - 40}" y1="${cy}" x2="${cx + 40}" y2="${cy}" stroke="#FF6A3D" stroke-width="1" opacity="0.7"/><line x1="${cx}" y1="${cy - 40}" x2="${cx}" y2="${cy + 40}" stroke="#FF6A3D" stroke-width="1" opacity="0.7"/>`);
      const r = 38 * f.s;
      t.push(`<g transform="rotate(${-a} ${cx} ${cy})"><rect x="${cx - r}" y="${cy - r * 0.16}" width="${2 * r}" height="${r * 0.32}" fill="none" stroke="#F5F5F7" stroke-width="1.4"/><rect x="${cx - r * 0.16}" y="${cy - r}" width="${r * 0.32}" height="${2 * r}" fill="none" stroke="#F5F5F7" stroke-width="1.4"/></g>`);
      t.push(`<text x="${x + 14}" y="${y + 26}" fill="#F5F5F7" font-size="18" font-weight="500">${f.no}</text>`);
      t.push(`<text x="${x + cw - 14}" y="${y + 26}" fill="#8E8E93" font-size="12" text-anchor="end">盘 ${f.plate}</text>`);
      t.push(`<text x="${cx}" y="${y + 122}" fill="#F5F5F7" font-size="13" text-anchor="middle">${+f.angle.toFixed(1)}° · ×${f.s.toFixed(2)}</text>`);
      t.push(`<text x="${cx}" y="${y + 138}" fill="#8E8E93" font-size="11" text-anchor="middle">${f.no}-1 上 · ${f.no}-2 下</text>`);

</script>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

let halves = null;
let raw = null, fileName = '示例楼板', baseMesh = null, geo = null;

// ---------- geometry state ----------
function rebuild() {
  baseMesh = Core.weld(raw, S.upY);

}

// ---------- UI ----------
const fmt = (v, d = 2) => (+v.toFixed(d)).toLocaleString('zh-CN', { maximumFractionDigits: d });
function updateInfo() {
  const u = S.unit, s = geo.bb.size;
  const es = geo.es;
  const state = es.closed ? '闭合实体 · 直接使用'
    : es.nonManifold ? '<span class="warn">非流形网格 · 无法加厚，按原样使用</span>'
    : '开放面 · 已两侧加厚成实体';

    ? `<br><span class="dot"></span>已统一法线：翻转 ${geo.thick.flipped.toLocaleString()} 个面` + (geo.thick.twist ? `；${geo.thick.twist} 条扭转边已缝合` : '')

    `${fmt(s[0] * u)} × ${fmt(s[1] * u)} × ${fmt(s[2] * u, 3)} m · ${(baseMesh.F.length / 3).toLocaleString()} 面<br>` +
    `<span class="dot"></span>${state}${fix}`;

function update(refit) {
  const p = params();

  const kmax = Math.floor((S.count - 1) / 2);

// ---------- print parts ----------
const PLATE = 256, MARGIN = 5, GAP = 6;

  if (!halves) {

  const pl = plan(fl);
  const wReal = PR.wall * PR.den / 1000;
  $('readPrint').innerHTML =
    `每层切成上下两半（单体中线），上半翻面打印<br>` +
    `单片 ${fmt(pl.maxD, 0)}–${fmt(pl.minD, 0)} mm 见方 · 高约 ${fmt(pl.halfH, 1)} mm<br>` +
    `${S.count * 2} 片 · 约 ${pl.plates.length} 盘 · 壁厚相当于真实 ${fmt(wReal, 2)} m` +
    (pl.fits ? '' : `<br><span class="warn">最大单片超过 ${PLATE - 2 * MARGIN} mm，放不进 A1，请换小一点的比例</span>`);

}

  return Core.printPieces(getHalves(), geo.c, fl[i].s, printFactor(), PR.wall, i + 1, PR.labels, 5);
}
function showPreview(n) {
  const fl = Core.floors(params());

  const P = piecesFor(i, fl);
  const a = P.upper, b = P.lower;
  const off = (a.size[0] + b.size[0]) / 4 + 5;
  const V = new Float64Array(a.V.length + b.V.length);

function bindSlider(key, nId, rId, opts = {}) {
  const n = $(nId), r = $(rId);
  const paint = () => { const p = (r.value - r.min) / (r.max - r.min) * 100; r.style.setProperty('--p', Math.max(0, Math.min(100, p)) + '%'); };
  const set = (v, from) => {

    if (from !== n) n.value = v;

  bindSlider('count', 'nCount', 'rCount', { int: true, lo: 1, hi: 1000 }),
  bindSlider('gap', 'nGap', 'rGap', { lo: 0, hi: 1000 }),
  bindSlider('minR', 'nMin', 'rMin', { lo: 0.01, hi: 5 }),
  bindSlider('step', 'nRot', 'rRot', { lo: -360, hi: 360 }),
];
function bindSeg(id, key, conv, geom) {
  const el = $(id);
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    S[key] = conv(b.dataset.v);
    syncSeg(id, key);
    if (geom) rebuild(); else update(false);
  });
}
function syncSeg(id, key) {
  for (const b of $(id).querySelectorAll('button')) b.classList.toggle('on', String(S[key]) === String(conv[id](b.dataset.v)));
}
const conv = { segUnit: Number, segUp: v => v === 'y', segCurve: v => v, segPivot: v => v };
bindSeg('segUnit', 'unit', Number, true);
bindSeg('segUp', 'upY', v => v === 'y', true);
bindSeg('segCurve', 'curve', v => v, false);
bindSeg('segPivot', 'pivot', v => v, true);
function syncAll() {
  sliders.forEach(s => s.sync());
  wallSlider.sync();

}

function defaultGap(pos, unit, upY) {
  const bb = Core.bbox(pos);
  const h = (upY ? bb.size[1] : bb.size[2]) * unit;
  return h > 2.5 ? 0 : GH.gap;
}
function guessUnit(pos) {
  const bb = Core.bbox(pos);
  const m = Math.max(...bb.size);
  return m >= 1000 ? 0.001 : 1;
}
function loadBuffer(buf, name, quiet) {
  let pos;
  try { pos = Core.parseSTL(buf); } catch (e) { pos = null; }
  if (!pos || pos.length < 9) { toast('没读到三角面，请确认是 STL 文件'); return; }
  raw = pos; fileName = name;

  S.gap = defaultGap(pos, S.unit, S.upY);

  rebuild();

}
function loadSample() {
  raw = Core.samplePlate(); fileName = '示例楼板'; S.unit = 1; S.upY = false;

}
const drop = $('drop'), file = $('file');
drop.addEventListener('click', () => file.click());
file.addEventListener('change', () => { const f = file.files[0]; if (f) f.arrayBuffer().then(b => loadBuffer(b, f.name)); file.value = ''; });
for (const ev of ['dragenter', 'dragover']) document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); });

$('btnSample').onclick = loadSample;
// the bundled sample unit sits next to this page; opened from disk (no server) it falls back to the plate
async function loadUnit(quiet) {
  try {
    const r = await fetch('sample-unit.stl');
    if (!r.ok) throw new Error(r.status);
    loadBuffer(await r.arrayBuffer(), '示例单体.stl', quiet);
  } catch (e) { loadSample(); if (!quiet) toast('示例单体需要在网页上打开，已载入示例楼板'); }
}
$('btnUnit').onclick = () => loadUnit(false);
$('btnReset').onclick = () => { Object.assign(S, GH); S.gap = defaultGap(raw, S.unit, S.upY); syncAll(); rebuild(); };
$('btnFit').onclick = () => { R.fit(); R.draw(); };
$('btnPrev').onclick = () => {
  if (PR.preview) { update(true); return; }

};
$('btnPrint').onclick = async () => {

    const folder = `${baseName()}_1-${PR.den}_打印件/`;
    const entries = [], missing = [];
    for (let i = 0; i < fl.length; i++) {
      btn.textContent = `${i + 1}/${fl.length}`;
      await new Promise(r => setTimeout(r, 0));
      const P = piecesFor(i, fl);
      for (const pc of [P.upper, P.lower]) {
        if (PR.labels && !pc.placed) missing.push(pc.name);
        const stl = new Uint8Array(Core.exportSTL(pc.V, pc.F, [0, 0, 0], [{ i: 0, z: 0, s: 1, th: 0 }], 1));
        entries.push(await Core.zipEntry(folder + pc.name + '.stl', stl));
      }
    }
    btn.textContent = '打包…';
    const info = {
      title: fileName.replace(/\.stl$/i, ''), scaleDen: PR.den, wall: PR.wall,
      floors: fl.map(f => ({ no: f.i + 1, angle: f.th * 180 / Math.PI, s: f.s, plate: pl.plates.findIndex(p => p.includes(f.i + 1)) + 1 })),
      plates: pl.plates.map(p => p.flatMap(n => [n + '-1', n + '-2'])),
    };
    const enc = new TextEncoder();
    entries.push(await Core.zipEntry(folder + '组装图.svg', enc.encode(Core.assemblySVG(info))));
    const notes = [
      `单体塔楼 · 打印分件`, `比例 1:${PR.den} · 打印壁厚 ${PR.wall} mm（相当于真实 ${PR.wall * PR.den / 1000} m）· 单位 mm`,
      `每层切成上下两半：N-1 = 上半（已翻面，平面朝下打印，组装时翻回），N-2 = 下半`,
      `层号凸字在臂内槽底，组装后被盖住`, `扭转：每层相对下一层 ${S.step}°（逆时针，俯视），见 组装图.svg`, '',
      `打印盘分配（A1 256 × 256 mm）：`, ...info.plates.map((p, i) => `盘 ${i + 1}：${p.join('、')}`),
      ...(missing.length ? ['', `以下零件放不下层号：${missing.join('、')}`] : []),
    ].join('\r\n');
    entries.push(await Core.zipEntry(folder + '说明.txt', enc.encode('\ufeff' + notes)));
    save(new Blob(Core.zipBlobParts(entries), { type: 'application/zip' }), `${baseName()}_1-${PR.den}_打印件.zip`, 'application/zip');
    toast(`已导出 ${fl.length * 2} 片` + (missing.length ? ` · ${missing.length} 片层号放不下` : ''));
  } catch (e) { console.error(e); toast('导出失败：' + (e.message || e)); }
  btn.disabled = false; btn.textContent = '导出 ZIP';
};

let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

// ---------- export ----------
const unitName = () => S.unit === 0.001 ? 'Millimeters' : S.unit === 0.01 ? 'Centimeters' : 'Meters';
const baseName = () => (fileName.replace(/\.stl$/i, '') || 'unit') + `_tower_${S.count}F`;
function save(data, name, type) {
  const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
const busy = (btn, f) => async () => {
  const old = btn.textContent; btn.disabled = true; btn.textContent = '…';
  await new Promise(r => setTimeout(r, 30));
  try { await f(); } catch (e) { console.error(e); toast('导出失败：' + (e.message || e)); }
  btn.disabled = false; btn.textContent = old;
};
$('exSTL').onclick = busy($('exSTL'), () => save(Core.exportSTL(geo.V, geo.F, geo.c, Core.floors(params()), 1), baseName() + '.stl', 'model/stl'));
$('exOBJ').onclick = busy($('exOBJ'), () => save(Core.exportOBJ(geo.V, geo.F, geo.c, Core.floors(params()), 1), baseName() + '.obj', 'text/plain'));
let rhinoP = null;
const RHINO = 'https://cdn.jsdelivr.net/npm/rhino3dm@8.4.0/';
function loadRhino() {
  if (rhinoP) return rhinoP;
  rhinoP = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = RHINO + 'rhino3dm.js';
    s.onload = () => rhino3dm({ locateFile: f => RHINO + f }).then(res, rej);
    s.onerror = () => rej(new Error('无法加载 rhino3dm（需要联网）'));
    document.head.appendChild(s);
  }).catch(e => { rhinoP = null; throw e; });
  return rhinoP;
}
$('ex3DM').onclick = busy($('ex3DM'), async () => {
  toast('正在加载 Rhino 库…');
  const rhino = await loadRhino();
  const bytes = Core.export3DM(rhino, geo.V, geo.F, geo.c, Core.floors(params()), 1, unitName());
  save(bytes, baseName() + '.3dm', 'application/octet-stream');
});

// ---------- WebGL renderer ----------
const R = (() => {
  const cv = $('gl');
  const gl = cv.getContext('webgl2', { antialias: true });
  if (!gl) { $('err').style.display = 'flex'; $('err').textContent = '浏览器不支持 WebGL2，无法预览（导出仍可用）'; return { setFloors() {}, fit() {}, draw() {} }; }
  const sh = (t, src) => { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = (vs, fs) => { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; };
  const meshP = prog(`#version 300 es
    layout(location=0) in vec3 aP; layout(location=1) in vec3 aN; layout(location=2) in vec4 aI;
    uniform mat4 uVP; uniform float uN;
    out vec3 vN; out vec3 vW; out float vT;
    void main(){
      float c=cos(aI.y), s=sin(aI.y);
      vec2 xy=aP.xy*aI.x; xy=vec2(c*xy.x-s*xy.y, s*xy.x+c*xy.y);
      vec3 w=vec3(xy, aP.z+aI.z);
      vec2 nxy=aN.xy/max(aI.x,1e-4); nxy=vec2(c*nxy.x-s*nxy.y, s*nxy.x+c*nxy.y);
      vN=normalize(vec3(nxy,aN.z)); vW=w; vT=aI.w/max(uN-1.0,1.0);
      gl_Position=uVP*vec4(w,1.0);
    }`, `#version 300 es
    precision highp float;
    in vec3 vN; in vec3 vW; in float vT; uniform vec3 uEye; out vec4 o;
    void main(){
      vec3 n=normalize(vN); vec3 v=normalize(uEye-vW);
      if(dot(n,v)<0.0) n=-n;
      vec3 L=normalize(vec3(0.45,-0.35,0.82));
      float d=max(dot(n,L),0.0);
      float hemi=0.5+0.5*n.z;
      float rim=pow(1.0-max(dot(n,v),0.0),3.0);
      vec3 base=mix(vec3(0.42,0.42,0.44), vec3(0.96,0.96,0.97), vT);
      vec3 col=base*(0.22+0.18*hemi+0.62*d)+rim*0.18;
      o=vec4(pow(col,vec3(0.95)),1.0);
    }`);
  const lineP = prog(`#version 300 es
    layout(location=0) in vec3 aP; uniform mat4 uVP; void main(){ gl_Position=uVP*vec4(aP,1.0); }`,
    `#version 300 es
    precision highp float; uniform vec4 uC; out vec4 o; void main(){ o=uC; }`);
  const vao = gl.createVertexArray(), vbo = gl.createBuffer(), ibo = gl.createBuffer();
  const lvao = gl.createVertexArray(), lvbo = gl.createBuffer();
  let nVerts = 0, nInst = 0, gridN = 0, axisStart = 0;
  let cam = { az: -0.75, el: 0.42, dist: 100, tgt: [0, 0, 0] };
  let ext = { r: 10, h: 10, z0: 0 };

  function upload(g) {
    const { V, F, c } = g;
    const nt = F.length / 3;
    const data = new Float32Array(nt * 18);
    for (let t = 0; t < nt; t++) {
      const a = F[t * 3] * 3, b = F[t * 3 + 1] * 3, d = F[t * 3 + 2] * 3;
      const ux = V[b] - V[a], uy = V[b + 1] - V[a + 1], uz = V[b + 2] - V[a + 2];
      const wx = V[d] - V[a], wy = V[d + 1] - V[a + 1], wz = V[d + 2] - V[a + 2];
      let nx = uy * wz - uz * wy, ny = uz * wx - ux * wz, nz = ux * wy - uy * wx;
      const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
      [a, b, d].forEach((i, k) => {
        const o = t * 18 + k * 6;
        data[o] = V[i] - c[0]; data[o + 1] = V[i + 1] - c[1]; data[o + 2] = V[i + 2] - c[2];
        data[o + 3] = nx; data[o + 4] = ny; data[o + 5] = nz;
      });
    }
    gl.bindVertexArray(vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);
    gl.bindBuffer(gl.ARRAY_BUFFER, ibo);
    gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 16, 0); gl.vertexAttribDivisor(2, 1);
    gl.bindVertexArray(null);
    nVerts = nt * 3;
  }

  function setFloors(fl, g, p) {
    const inst = new Float32Array(fl.length * 4);
    fl.forEach((f, i) => { inst[i * 4] = f.s; inst[i * 4 + 1] = f.th; inst[i * 4 + 2] = f.z; inst[i * 4 + 3] = i; });
    gl.bindBuffer(gl.ARRAY_BUFFER, ibo);
    gl.bufferData(gl.ARRAY_BUFFER, inst, gl.DYNAMIC_DRAW);
    nInst = fl.length;
    // extents relative to the pivot
    const { V, c, bb } = g;
    let r = 0;
    for (let i = 0; i < V.length; i += 3) r = Math.max(r, Math.hypot(V[i] - c[0], V[i + 1] - c[1]));
    const smax = Math.max(1, ...fl.map(f => f.s));
    const z0 = bb.min[2] - c[2], z1 = bb.max[2] - c[2] + (fl.length - 1) * p.pitch;
    ext = { r: r * smax, h: z1 - z0, z0, z1 };
    buildLines();
  }

  function buildLines() {
    const L = [];
    const step = niceStep(ext.r * 2.4 / 12);
    const half = Math.ceil(ext.r * 1.6 / step) * step;
    const z = ext.z0;
    for (let x = -half; x <= half + 1e-9; x += step) { L.push(x, -half, z, x, half, z); L.push(-half, x, z, half, x, z); }
    gridN = L.length / 3;
    axisStart = gridN;
    L.push(0, 0, ext.z0 - ext.h * 0.03, 0, 0, ext.z1 + ext.h * 0.05);
    gl.bindVertexArray(lvao);
    gl.bindBuffer(gl.ARRAY_BUFFER, lvbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(L), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
    gl.bindVertexArray(null);
  }
  function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x))); const m = x / p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; }

  function fit() {
    cam.tgt = [0, 0, ext.z0 + ext.h * 0.5];
    const size = Math.max(ext.h, ext.r * 2.2);
    const asp = cv.clientWidth / Math.max(1, cv.clientHeight);
    cam.dist = size / (2 * Math.tan(17.5 * Math.PI / 180)) / Math.min(1, asp) * 1.42;
    cam.az = -0.75; cam.el = 0.3;
  }

  function mats() {
    const asp = cv.width / Math.max(1, cv.height);
    const f = 1 / Math.tan(17.5 * Math.PI / 180);
    const near = cam.dist * 0.01, far = cam.dist * 20;
    const P = [f / asp, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) / (near - far), -1, 0, 0, 2 * far * near / (near - far), 0];
    const ce = Math.cos(cam.el);
    const eye = [cam.tgt[0] + cam.dist * ce * Math.cos(cam.az), cam.tgt[1] + cam.dist * ce * Math.sin(cam.az), cam.tgt[2] + cam.dist * Math.sin(cam.el)];
    const zA = norm(sub(eye, cam.tgt)), xA = norm(cross([0, 0, 1], zA)), yA = cross(zA, xA);
    const Vw = [xA[0], yA[0], zA[0], 0, xA[1], yA[1], zA[1], 0, xA[2], yA[2], zA[2], 0, -dot(xA, eye), -dot(yA, eye), -dot(zA, eye), 1];
    return { VP: mul(P, Vw), eye, xA, yA };
  }
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = a => { const l = Math.hypot(...a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  function mul(a, b) { const o = new Array(16).fill(0); for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) for (let k = 0; k < 4; k++) o[c * 4 + r] += a[k * 4 + r] * b[c * 4 + k]; return o; }

  let raf = 0;
  function draw() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }
  function render() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.round(cv.clientWidth * dpr), h = Math.round(cv.clientHeight * dpr);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    gl.viewport(0, 0, w, h);
    gl.clearColor(0.012, 0.012, 0.012, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    const m = mats();
    gl.useProgram(lineP);
    gl.uniformMatrix4fv(gl.getUniformLocation(lineP, 'uVP'), false, m.VP);
    gl.bindVertexArray(lvao);
    gl.uniform4f(gl.getUniformLocation(lineP, 'uC'), 0.17, 0.17, 0.18, 1);
    gl.drawArrays(gl.LINES, 0, gridN);
    gl.useProgram(meshP);
    gl.uniformMatrix4fv(gl.getUniformLocation(meshP, 'uVP'), false, m.VP);
    gl.uniform3fv(gl.getUniformLocation(meshP, 'uEye'), m.eye);
    gl.uniform1f(gl.getUniformLocation(meshP, 'uN'), nInst);
    gl.bindVertexArray(vao);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, nVerts, nInst);
    gl.useProgram(lineP);
    gl.bindVertexArray(lvao);
    gl.disable(gl.DEPTH_TEST);
    gl.uniform4f(gl.getUniformLocation(lineP, 'uC'), 1.0, 0.416, 0.239, 0.55);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.drawArrays(gl.LINES, axisStart, 2);
    gl.disable(gl.BLEND);
    gl.bindVertexArray(null);
  }

  // orbit / pan / zoom
  const ptrs = new Map(); let last = null, pinch = 0, panMode = false;
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); panMode = e.button === 2 || e.shiftKey; last = [e.clientX, e.clientY]; if (ptrs.size === 2) pinch = pdist(); });
  cv.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 2) {
      const d = pdist(); if (pinch) cam.dist *= pinch / d; pinch = d;
      const c = centre(); if (last) pan(c[0] - last[0], c[1] - last[1]); last = c; draw(); return;
    }
    const dx = e.clientX - last[0], dy = e.clientY - last[1]; last = [e.clientX, e.clientY];
    if (panMode) pan(dx, dy);
    else { cam.az -= dx * 0.006; cam.el = Math.max(-1.45, Math.min(1.45, cam.el + dy * 0.006)); }
    draw();
  });
  const up = e => { ptrs.delete(e.pointerId); pinch = 0; last = ptrs.size ? centre() : null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); cam.dist *= Math.exp(e.deltaY * 0.0012); draw(); }, { passive: false });
  function pdist() { const [a, b] = [...ptrs.values()]; return Math.hypot(a[0] - b[0], a[1] - b[1]) || 1; }
  function centre() { const [a, b] = [...ptrs.values()]; return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; }
  function pan(dx, dy) {
    const m = mats(); const k = cam.dist * 2 * Math.tan(17.5 * Math.PI / 180) / cv.clientHeight;
    for (let i = 0; i < 3; i++) cam.tgt[i] += (-dx * m.xA[i] + dy * m.yA[i]) * k;
  }
  new ResizeObserver(draw).observe(cv);
  return { upload, setFloors, fit, draw };
})();
function uploadMesh() { R.upload(geo); }

window.__app = { S, Core, get geo() { return geo; }, loadBuffer, rebuild };
loadSample();
loadUnit(true);
})();

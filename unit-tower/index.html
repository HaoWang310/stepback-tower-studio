<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>单体塔楼生成器 · Unit Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --panel:#0b0b0c; --line:#1c1c1e; --line2:#2c2c2e;
  --t1:#f5f5f7; --t2:rgba(245,245,247,.56); --t3:rgba(245,245,247,.34);
  --accent:#ff6a3d; --r:12px;
  --font:"DM Sans",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
#app{display:flex;height:calc(100% - 52px);gap:12px;padding:12px}
#steps{height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;border-bottom:0.5px solid var(--line2)}
#steps .back{color:var(--t2);text-decoration:none;font-size:13px;white-space:nowrap}
#steps .back:hover{color:var(--t1)}
.stepper{display:flex;align-items:center;gap:8px;min-width:0}
.st{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 6px;border-radius:18px;background:#1c1c1e;border:0;color:var(--t1);font:inherit;cursor:pointer;text-decoration:none;min-width:0}
.st:hover{background:#2c2c2e}
.st i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:500;background:#3a3a3c}
.st b{font-weight:500;font-size:13px;white-space:nowrap}
.st small{color:var(--t3);font-size:11px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st.on{background:var(--t1);color:#000}.st.on i{background:#000;color:#fff}.st.on small{color:rgba(0,0,0,.55)}
.st.done i{background:#00c8d2;color:#000}
.sl{flex:none;width:18px;height:1px;background:#3a3a3c}
.ucard{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;background:#1c1c1e;border-radius:12px;padding:10px}
.ucard img{width:76px;height:76px;object-fit:cover;border-radius:8px;background:#000}
.ucard b{font-weight:500;font-size:13px;display:block;line-height:1.35}
.ucard small{display:block;color:var(--t3);font-size:11.5px;line-height:1.5;margin-top:2px}
.ucard a{color:#64d2ff;font-size:12px;text-decoration:none;display:inline-block;margin-top:4px}
body[data-mode=tower] #secPrint{display:none}
body[data-mode=print] #panel > .sec:not(#secPrint):not(#secUnit){display:none}
body[data-mode=print] #nextWrap{display:none}
#nextWrap{position:sticky;bottom:-22px;margin:22px -18px -22px;padding:14px 18px 18px;background:linear-gradient(rgba(11,11,12,0),var(--panel) 35%)}
#nextWrap .btn{width:100%;padding:12px 0;font-size:14px}
#ticks{position:relative;height:8px;margin:-2px 7px 0}
#ticks i{position:absolute;top:0;width:2px;height:8px;background:#00c8d2;border-radius:1px;transform:translateX(-1px)}
.read .ok{color:#00c8d2}
#panel{width:300px;flex:none;background:var(--panel);border:0.5px solid var(--line2);border-radius:16px;overflow-y:auto;padding:18px 18px 22px;scrollbar-width:thin;scrollbar-color:#2c2c2e transparent}
#view{position:relative;flex:1;min-width:0;background:#030303;border:0.5px solid var(--line2);border-radius:16px;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
h1{font-size:17px;font-weight:500;letter-spacing:-.01em}
.sub{color:var(--t2);font-size:12px;margin-top:4px;line-height:1.5}
.sec{margin-top:22px;padding-top:18px;border-top:0.5px solid var(--line)}
.sec h2{font-size:13px;font-weight:500;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.sec h2 span{color:var(--t3);font-weight:400;font-size:11px}
#drop{border:0.8px dashed #48484a;border-radius:10px;padding:16px 10px;text-align:center;color:var(--t2);cursor:pointer;transition:border-color .2s,background .2s;line-height:1.5}
#drop:hover,#drop.over{border-color:var(--t1);background:rgba(255,255,255,.03);color:var(--t1)}
#drop b{font-weight:500;color:var(--t1)}
.info{margin-top:10px;color:var(--t2);font-size:12px;line-height:1.7}
.info .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.row:first-of-type{margin-top:0}
.row label{color:var(--t2)}
.num{width:66px;background:transparent;border:0;color:var(--t1);font:inherit;text-align:right;padding:2px 0;border-bottom:0.5px solid transparent;outline:none;-moz-appearance:textfield}
.num:focus{border-bottom-color:var(--t2)}
.num::-webkit-inner-spin-button,.num::-webkit-outer-spin-button{-webkit-appearance:none}
.unit{color:var(--t3);margin-left:3px;font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin-top:4px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:1px;background:linear-gradient(to right,var(--t1) var(--p,50%),#3a3a3c var(--p,50%))}
input[type=range]::-moz-range-track{height:2px;border-radius:1px;background:#3a3a3c}
input[type=range]::-moz-range-progress{height:2px;background:var(--t1)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--t1);margin-top:-6px;border:0}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--t1);border:0}
.seg{display:inline-flex;background:#1c1c1e;border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;color:var(--t2);font:inherit;font-size:12px;padding:4px 10px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--t1);color:#000}
.read{color:var(--t3);font-size:11.5px;margin-top:8px;line-height:1.6}
.tag{display:inline-block;margin-left:7px;font-size:10.5px;color:var(--t3);border:0.5px solid #3a3a3c;border-radius:5px;padding:0 5px;line-height:16px;vertical-align:1px;white-space:nowrap}
.tag.conn{color:#00c8d2;border-color:rgba(0,200,210,.45)}
.tag.manual{cursor:pointer}
.tag.manual:hover{color:var(--t1);border-color:var(--t2)}
.tag:empty{display:none}
#readForm .hotdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#FF9F0A;margin-right:5px;vertical-align:0}
#readScale{margin-top:4px}
#segScale button{white-space:nowrap}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.btn{border:0.5px solid #48484a;background:transparent;color:var(--t1);font:inherit;font-weight:500;padding:9px 0;border-radius:9px;cursor:pointer;transition:background .2s}
.btn:hover{background:rgba(255,255,255,.06)}
.btn.primary{background:var(--t1);color:#000;border-color:var(--t1)}
.btn.primary:hover{background:#fff}
.btn:disabled{opacity:.4;cursor:default}
.link{background:none;border:0;color:var(--t2);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-top:8px}
.warn{color:#ff453a}
.caution{color:#ffd60a}
.scl{display:flex;align-items:center;gap:6px}
.scl .num{width:64px;text-align:right}
.sbtn{width:30px;height:28px;padding:0;font-size:16px;line-height:1}
.sclhint{text-align:right;color:var(--t3);font-size:11px;margin:-4px 0 6px}
.fixbtn{margin-top:6px;padding:6px 12px;font-size:12px}
#hud{position:absolute;left:0;right:0;bottom:16px;text-align:center;pointer-events:none}
#hud .a{font-size:13px;color:var(--t1)}
#hud .b{font-size:11.5px;color:var(--t3);margin-top:4px}
#tools{position:absolute;top:12px;right:12px;display:flex;gap:6px}
#tools button{background:rgba(28,28,30,.8);border:0.5px solid var(--line2);color:var(--t2);font:inherit;font-size:12px;padding:6px 10px;border-radius:8px;cursor:pointer}
#tools button:hover{color:var(--t1)}
#tools button.on{background:var(--t1);color:#000;border-color:var(--t1)}
#legend{position:absolute;left:18px;bottom:18px;display:grid;grid-template-columns:auto auto;gap:4px 10px;font-size:11px;color:var(--t2);pointer-events:none}
#legend span{grid-column:1/3}
#legend i{grid-column:1/3;display:block;width:150px;height:6px;border-radius:3px;background:linear-gradient(to right,#ededf2,#ff6a3d)}
#legend b{font-weight:400}#legend #legB{text-align:right}
#cap{position:absolute;top:16px;left:18px;max-width:60%;pointer-events:none}
#cap .k{font-size:11px;color:var(--t3);letter-spacing:.04em}
#cap .t{font-size:18px;font-weight:500;margin-top:4px;letter-spacing:-.01em}
#cap .s{font-size:12.5px;color:var(--t2);margin-top:4px;line-height:1.5}
#cap .bar{display:flex;gap:4px;margin-top:10px}
#cap .bar i{display:block;width:22px;height:3px;border-radius:2px;background:#2c2c2e;transition:background .3s}
#cap .bar i.on{background:var(--t1)}
#cap .bar i.orbit.on{background:#64d2ff}
/* 拓竹检查 + 修复 STL */
.chk{font-size:11.5px;color:var(--t3);margin-top:8px;line-height:1.6}
.chk:empty,#readSimp:empty,#readSimp2:empty{display:none}
.chk .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0;background:#30d158}
.chk .dot.fix{background:#FF9F0A}.chk .dot.bad{background:#ff453a}.chk .dot.idle{background:#48484a}
.chk b{color:var(--t1);font-weight:500}
.chk details{margin-top:2px}.chk summary{cursor:pointer;color:var(--t2)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:60}
.sheet.hidden{display:none}
.sheetBox{width:min(440px,92vw);background:#1c1c1e;border:0.5px solid var(--line2);border-radius:18px;padding:20px 22px 22px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sheetHead{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.sheetHead .link{margin:0}
.fdrop{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:14px;border:1px dashed #48484a;border-radius:14px;padding:26px 12px;cursor:pointer;transition:border-color .2s,background .2s}
.fdrop b{font-weight:500;font-size:14px}.fdrop span{color:var(--t3);font-size:11.5px}
.fdrop.over,.fdrop:hover{border-color:#00c8d2;background:rgba(0,200,210,.05)}
.fsteps{margin:14px 0 0;padding:0;list-style:none;counter-reset:s;font-size:12px;color:var(--t2)}
.fsteps li{counter-increment:s;display:flex;align-items:center;gap:9px;line-height:24px}
.fsteps li::before{content:counter(s);width:16px;height:16px;border-radius:50%;border:1px solid #00c8d2;color:#00c8d2;font-size:10px;line-height:15px;text-align:center;flex:none}
.fsteps li.done{color:var(--t1)}.fsteps li.done::before{content:'✓';background:#00c8d2;color:#000}
#toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(28,28,30,.92);border:0.5px solid var(--line2);padding:8px 14px;border-radius:10px;font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:13px;pointer-events:none}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--t2);text-align:center;padding:30px}
.hidden{display:none!important}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec h2 b{font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{min-width:34px;border:0.5px solid #48484a;background:transparent;color:var(--t2);font:inherit;font-size:12px;padding:5px 0;border-radius:8px;cursor:pointer}
.chips button.on{background:var(--t1);color:#000;border-color:var(--t1)}
@media (max-width:760px){
  .st small{display:none} .st{padding:0 10px 0 6px} #steps{padding:0 10px} #steps .back{display:none}
  #app{flex-direction:column-reverse;padding:8px;gap:8px}
  #panel{width:auto;height:46%;border-radius:14px}
  #view{flex:1}
}
</style>
</head>
<body data-mode="tower">
<nav id="steps">
  <a class="back" href="../minimal-surfaces/" data-i18n="stCatalogue">‹ 目录</a>
  <div class="stepper">
    <a class="st done" id="st1" href="../minimal-surfaces/"><i>✓</i><b data-i18n="st1"></b><small id="st1s"></small></a>
    <span class="sl"></span>
    <button class="st on" id="st2" type="button"><i>2</i><b data-i18n="st2"></b><small id="st2s"></small></button>
    <span class="sl"></span>
    <button class="st" id="st3" type="button"><i>3</i><b data-i18n="st3"></b><small id="st3s"></small></button>
  </div>
  <div class="seg" id="segLang"><button data-v="zh">中</button><button data-v="en">EN</button></div>
</nav>
<div id="app">
  <aside id="panel">
    <div class="head"><h1 data-i18n="title">单体塔楼生成器</h1></div>
    <p class="sub" data-i18n="sub"></p>

    <div class="sec hidden" id="secUnit">
      <h2><b data-i18n="secUnit"></b> <span data-i18n="fromCatalogue"></span></h2>
      <div class="ucard"><img id="uThumb" alt=""><div><b id="uName"></b><small id="uParams"></small><small id="uSize"></small><a id="uBack" href="../minimal-surfaces/" data-i18n="changeUnit"></a></div></div>
    </div>

    <div class="sec">
      <h2><b data-i18n="secInput"></b> <span id="fname"></span></h2>
      <div id="drop" data-i18n-html="drop"></div>
      <input id="file" type="file" accept=".stl,model/stl" hidden>
      <div class="info" id="info"></div>
      <div class="row"><label data-i18n="units"></label>
        <div class="seg" id="segUnit"><button data-v="0.001">mm</button><button data-v="0.01">cm</button><button data-v="1">m</button></div></div>
      <div class="row"><label data-i18n="upAxis"></label>
        <div class="seg" id="segUp"><button data-v="z" class="on">Z</button><button data-v="y">Y</button></div></div>
      <div><button class="link" id="btnUnit" data-i18n="btnUnit"></button> <button class="link" id="btnSample" style="margin-left:12px" data-i18n="btnSample"></button><button class="link hidden" id="btnForget" style="margin-left:12px" data-i18n="forget"></button></div>
    </div>

    <div class="sec" id="secThick">
      <h2><b data-i18n="secThick"></b> <span data-i18n="thickNote"></span></h2>
      <div class="row"><label data-i18n="thickness"></label><span><input class="num" id="nThick" type="number" step="0.01"><span class="unit">m</span></span></div>
      <input type="range" id="rThick" min="0.01" max="1" step="0.01">
    </div>

    <div class="sec">
      <h2 data-i18n="secStack"></h2>
      <div class="row"><label data-i18n="floors"></label><span><input class="num" id="nCount" type="number" step="1"></span></div>
      <input type="range" id="rCount" min="1" max="120" step="1">
      <div class="row"><label data-i18n="gap"></label><span><input class="num" id="nGap" type="number" step="0.1"><span class="unit">m</span></span></div>
      <input type="range" id="rGap" min="0" max="12" step="0.1">
      <div class="read" id="readStack"></div>
    </div>

    <div class="sec">
      <h2 data-i18n="secWaist"></h2>
      <div class="row"><label data-i18n="minR"></label><span><input class="num" id="nMin" type="number" step="0.01"></span></div>
      <input type="range" id="rMin" min="0.2" max="1.5" step="0.01">
      <div class="row"><label data-i18n="curve"></label>
        <div class="seg" id="segCurve"><button data-v="linear" class="on" data-i18n="linear"></button><button data-v="smooth" data-i18n="smooth"></button></div></div>
      <div class="row"><label><span data-i18n="scaleMode"></span><span class="tag" id="scaleTag"></span></label>
        <div class="seg" id="segScale"><button data-v="step" class="on" data-i18n="scStep"></button><button data-v="cont" data-i18n="scCont"></button></div></div>
      <div class="read" id="readScale"></div>
      <div class="row"><label data-i18n="shade"></label>
        <div class="seg" id="segShade"><button data-v="0" class="on" data-i18n="whiteModel"></button><button data-v="2" id="shadePal" class="hidden" data-i18n="catColour"></button><button data-v="1" data-i18n="waistColour"></button></div></div>
      <div class="row"><label data-i18n="envLines"></label>
        <div class="seg" id="segEnv"><button data-v="1" class="on" data-i18n="show"></button><button data-v="0" data-i18n="hide"></button></div></div>
      <div class="read" id="readWaist"></div>
    </div>

    <div class="sec">
      <h2 data-i18n="secTwist"></h2>
      <div class="row"><label data-i18n="step"></label><span><input class="num" id="nRot" type="number" step="0.5"><span class="unit">°</span></span></div>
      <input type="range" id="rRot" min="-180" max="180" step="0.5">
      <div id="ticks"></div>
      <div class="row"><label data-i18n="pivot"></label>
        <div class="seg" id="segPivot"><button data-v="centroid" class="on" data-i18n="centroid"></button><button data-v="bbox" data-i18n="bboxc"></button></div></div>
      <div class="read" id="readTwist"></div>
    </div>

    <div class="sec" id="secPrint">
      <h2><b data-i18n="secPrint"></b> <span>Bambu Lab A1 · 256 mm</span></h2>
      <div class="row"><label><span data-i18n="formKeep"></span><span class="tag" id="formTag"></span></label>
        <div class="seg" id="segForm"><button data-v="1" class="on" data-i18n="on"></button><button data-v="0" data-i18n="off"></button></div></div>
      <div class="read" id="readForm" style="margin-top:2px"></div>
      <div class="row"><label data-i18n="wall"></label><span><input class="num" id="nWall" type="number" step="0.1"><span class="unit">mm</span></span></div>
      <input type="range" id="rWall" min="0.4" max="3" step="0.1">
      <div class="row"><label><span data-i18n="scale"></span><span class="tag" id="denTag"></span></label>
        <span class="scl"><span class="unit">1 :</span><input class="num" id="nScale" type="number" min="1" max="1000" step="1" inputmode="numeric" aria-describedby="sclHint"><button class="btn sbtn" id="sclDn" type="button" aria-label="−10">−</button><button class="btn sbtn" id="sclUp" type="button" aria-label="+10">+</button></span></div>
      <div class="sclhint" id="sclHint">1–1000</div>
      <div class="row"><label data-i18n="labels"></label>
        <div class="seg" id="segLabel"><button data-v="1" class="on" data-i18n="emboss"></button><button data-v="0" data-i18n="noEmboss"></button></div></div>
      <div class="row"><label data-i18n="margin"></label><span><input class="num" id="nMargin" type="number" step="1" style="width:40px"><span class="unit">mm</span></span></div>
      <div class="row"><label data-i18n="gapP"></label><span><input class="num" id="nGapP" type="number" step="1" style="width:40px"><span class="unit">mm</span></span></div>
      <div class="read" id="readPrint"></div>
      <div class="row"><label data-i18n="prevFloor"></label><span><input class="num" id="nPrev" type="number" step="1" value="1" style="width:40px"><span class="unit" data-i18n="prevUnit"></span></span></div>
      <div class="btns" style="grid-template-columns:1fr 1fr;margin-top:12px">
        <button class="btn" id="btnPrev" data-i18n="btnPrev"></button>
        <button class="btn" id="btnPlates" data-i18n="btnPlates"></button>
      </div>
      <div id="plateChips" class="chips hidden"></div>
      <button class="btn primary" id="btnPrint" style="width:100%;margin-top:8px" data-i18n="btnPrint"></button>
      <div class="chk" id="chkPrint"></div>
      <div class="read" id="readSimp"></div>
      <div class="row" style="margin-top:18px"><label data-i18n="segTitle"></label></div>
      <div class="read" id="readSeg" style="margin-top:2px"></div>
      <button class="btn" id="btnSeg" style="width:100%;margin-top:8px" data-i18n="btnSeg"></button>
      <div class="chk" id="chkSeg"></div>
      <button class="link" id="btnFix" data-i18n="fixLink"></button>
    </div>

    <div class="sec">
      <h2><b data-i18n="secExport"></b> <span id="expInfo"></span></h2>
      <div class="btns">
        <button class="btn primary" id="exSTL">STL</button>
        <button class="btn" id="exOBJ">OBJ</button>
        <button class="btn" id="ex3DM">3DM</button>
      </div>
      <div class="read" id="readExport"></div>
      <div class="chk" id="chkExport"></div>

    for (let i = 2; i < r.V.length; i += 3) r.V[i] = Math.min(flat.z1, Math.max(flat.z0, r.V[i]));
    const b1 = Core.bbox(r.V);
    Object.assign(geo, { V: r.V, F: r.F, side: r.side, bb: b1, h: b1.size[2], flat });

}

function params() {

}

// ---------- 层间对接：上一层顶边与下一层底边（转过扭转角）重合多少 ----------
// 只看开放曲面单体的顶 / 底边界；接触 ≥ 90% 的角度算「能对接」，扭转滑杆上画刻度并吸附。
// 同一次测量也给出单体的类型 SNAP.kind：
//   'conn'  衔接型 —— 顶、底是切开的边，转到某个角度时顶边和底边能重合 ≥ 90%（收腰默认「连续」）
//   'indep' 独立单体 —— 顶 / 底有水平的面，或没有切开的边，或哪个角度都对不上（收腰默认「逐层」）
const SNAP = { prof: null, list: [], any: false, kind: 'indep' };
function computeSnaps() {

  const es = Core.edgeStats(baseMesh.F, baseMesh.V.length / 3);
  if (es.closed || !es.boundary.length) { drawTicks(); return; }
  const V = baseMesh.V, bb = Core.bbox(V), tz = bb.size[2] * 1e-3 + 1e-9;
  const top = [], bot = [], L = Math.max(bb.size[0], bb.size[1]), step = L / 300, tol = L * 0.015;
  const samp = (out, a, b) => { const ax = V[a * 3], ay = V[a * 3 + 1], bx = V[b * 3], by = V[b * 3 + 1], n = Math.max(1, Math.ceil(Math.hypot(bx - ax, by - ay) / step)); for (let k = 0; k < n; k++) out.push(ax + (bx - ax) * k / n, ay + (by - ay) * k / n); };

    if (Math.abs(za - bb.max[2]) < tz && Math.abs(zb - bb.max[2]) < tz) samp(top, a, b);
    else if (Math.abs(za - bb.min[2]) < tz && Math.abs(zb - bb.min[2]) < tz) samp(bot, a, b);
  }

function update(refit, keepPlay) {
  if (!geo) return;
  if (typeof PLAY !== 'undefined' && PLAY.on && !keepPlay) stopPlay(false);
  const p = params();
  const fl = Core.floors(p);
  const u = S.unit;
  const H = ((S.count - 1) * p.pitch + geo.h) * u;
  $('readStack').textContent = t('readStack', { h: fmt(geo.h * u, 3), g: fmt(S.gap, 2), p: fmt(p.pitch * u, 3), H: fmt(H, 1) });
  const kmax = Math.floor((S.count - 1) / 2);
  const mids = S.count % 2 === 0 && S.count > 1 ? t('waistTwo', { a: S.count / 2, b: S.count / 2 + 1 }) : t('waistOne', { a: kmax + 1 });
  const contOn = !!(fl.length && fl[0].env);
  $('readWaist').textContent = S.count < 3 ? t('waistFew')
    : contOn ? t('waistCont', { r: fmt(S.minR, 2), p: fmt(Math.max(...fl.map(f => f.s - f.lo)) * 100, 1) })
    : t('waist', { m: mids, r: fmt(S.minR, 2) });
  scaleRead();
  $('readTwist').innerHTML = t('twistRead', { d: fmt((S.count - 1) * S.step, 1), t: fmt(Math.abs((S.count - 1) * S.step) / 360, 2) }) + twistNote();
  updateSteps();
  const tris = geo.F.length / 3 * S.count;
  const mb = (84 + tris * 50) / 1048576;
  $('expInfo').textContent = trisText(tris);
  $('readExport').innerHTML = (mb > 300 ? `<span class="warn">${t('stlBig', { mb: fmt(mb, 0) })}</span><br>` : (mb < 1 ? t('stlKB', { kb: fmt(mb * 1024, 0) }) : t('stlMB', { mb: fmt(mb, 1) })) + ' ') +
    t('exportNote');

  for (const id of ['exSTL', 'exOBJ', 'ex3DM']) $(id).disabled = simpWait();
  updatePrint(fl, p);
  if (keepPlay && PLAY.on) return;
  if (PR.preview || PR.plate) { PR.preview = 0; PR.plate = 0; R.setPlate(null); R.upload(geo); refit = true; }
  $('btnPrev').textContent = t('btnPrev');
  $('btnPlates').textContent = t('btnPlates');
  renderChips();
  R.setFloors(fl, geo, p);
  applyVis(VIS.colour ? 1 : 0, VIS.lines);
  saveParams();
  if (refit) R.fit();
  R.draw();

let fixWorker = null, fixTimer = 0;
function meshFixSource() {
  for (const sc of document.scripts) {

function showFixResult(file, before, r) {

  const a = r.after;

    t('fixAfter', { a: a.ok ? `<span class="ok">${t('fixAfterOk')}</span>` : `<span class="caution">${t('fixLeft', { o: a.open, m: a.nonManifold, v: a.reversed })}</span>` });

async function runFix(file) {
  const read = $('fixRead'); $('fixSave').classList.add('hidden'); FIX.out = null; stopFix();
  const fail = msg => { fixSteps(0); read.innerHTML = `<span class="warn">${msg}</span>`; };
  let buf;
  try { buf = await file.arrayBuffer(); } catch (e) { return fail(t('fixNotStl')); }
  if (!MeshFix.isSTL(buf)) return fail(t('fixNotStl'));
  const pos = MeshFix.parseSTL(buf);
  if (pos.length < 9) return fail(t('fixNotStl'));
  const n = Math.round(pos.length / 9 / 1e4), t0 = Date.now();
  const busyText = () => { read.textContent = t('fixBusy', { n }) + ' · ' + t('fixTime', { s: Math.round((Date.now() - t0) / 1000) }); };
  fixSteps(1); busyText();
  const src = meshFixSource();
  let w = null;
  try {
    if (src && window.Worker) w = new Worker(URL.createObjectURL(new Blob([src + `
onmessage = e => {
  const pos = new Float32Array(e.data), before = MeshFix.meshCheck(pos);
  postMessage({ step: 1 });
  if (before.ok) { postMessage({ done: true, before }); return; }
  const r = MeshFix.repairBest(pos, s => postMessage({ step: s }));
  const out = MeshFix.stlFromSoup(r.pos, 'repaired in Unit Tower generator');
  postMessage({ done: true, before, r: { after: r.after, splitEdges: r.splitEdges, removed: r.removed, holes: r.holes, holesLeft: r.holesLeft, out } }, [out]);
};`], { type: 'text/javascript' })));
  } catch (e) { w = null; }
  if (!w) {                                            // no workers here: do it on the page
    await new Promise(r => setTimeout(r, 30));
    const before = MeshFix.meshCheck(pos);
    if (before.ok) return showFixResult(file, before, null);
    const r = MeshFix.repairBest(pos);
    return showFixResult(file, before, Object.assign(r, { out: MeshFix.stlFromSoup(r.pos, 'repaired in Unit Tower generator') }));
  }
  fixWorker = w; $('fixCancel').classList.remove('hidden');
  fixTimer = setInterval(busyText, 1000);

    const d = e.data;
    if (d.step) { fixSteps(Math.min(6, d.step + 1)); return; }   // stage s started = the steps before it are done
    if (d.done) { stopFix(); showFixResult(file, d.before, d.r); }

  w.onerror = e => { stopFix(); console.error(e); fail(t('fixFail') + (e.message || '')); };
  w.postMessage(pos.buffer, [pos.buffer]);
}

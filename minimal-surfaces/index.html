<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>极小曲面目录</title>
<style>
/* VOICE: quiet studio instrument, nothing competes with the form
   IDEA: a lit physical model on a black plinth at an AADRL crit
   PICTURE: the exact Weber Scherk–Enneper surface, full screen, orbitable
   COLOUR and TYPE: black ground, olive front face + lavender back face (as the reference), ice-white accent; SF / PingFang
   LAYOUT: full viewport, one floating glass panel, one four-button dock */
:root{color-scheme:dark;--ink:#E8ECF2;--mute:#8A94A3;--line:rgba(255,255,255,.08);--glass:rgba(20,22,26,.74);--acc:#D9E3F0}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;min-height:100%;background:#000;color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
body.v{overflow:hidden;height:100%}
#viewer{display:none}body.v #viewer{display:block}body.v #home{display:none}
#home{max-width:1240px;margin:0 auto;padding:clamp(28px,5vw,64px) max(5vw,16px) 64px}
.hero h1{margin:0;font-size:clamp(32px,5vw,48px);line-height:1.05;font-weight:600;letter-spacing:-.01em}
.hero p{margin:10px 0 0;color:var(--mute);font-size:15px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:28px 0 8px}
.tags:empty{display:none}
.bar:has(.tags:empty){justify-content:flex-end}
.seg{display:inline-flex;padding:3px;border:1px solid #2A2F36;border-radius:999px}
.seg button{height:34px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:#C9D1DC;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--acc);color:#0b0d10}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags button{height:34px;padding:0 14px;border:1px solid #2A2F36;border-radius:999px;background:transparent;color:#C9D1DC;font:inherit;font-size:13px;cursor:pointer}
.tags button.on{background:var(--acc);border-color:var(--acc);color:#0b0d10}
.cat{margin-top:40px;border-top:1px solid #1C2026;padding-top:18px}
.cat h2{margin:0;font-size:20px;font-weight:500;display:flex;align-items:baseline;gap:10px}
.cat h2 small{color:var(--mute);font-size:13px;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:16px}
.card{all:unset;display:block;cursor:pointer;border:1px solid #1C2026;border-radius:16px;overflow:hidden;background:#07080a;transition:border-color .2s}
.card:hover,.card:focus-visible{border-color:var(--acc)}
.card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#000}
.card .meta{padding:12px 14px 14px}
.card .no{color:#8C9A78;font-size:12px}
.card .nm{font-size:16px;margin:2px 0 6px;color:#fff}
.card .sub{color:var(--mute);font-size:12px}
.pill{display:inline-block;margin:8px 4px 0 0;padding:2px 8px;border:1px solid #2A2F36;border-radius:999px;font-size:11px;color:#C9D1DC}
.empty{border:1px dashed #2A2F36;border-radius:16px;aspect-ratio:3/4;display:grid;place-items:center;color:#4A525C;font-size:13px;max-width:260px}
table{width:100%;border-collapse:collapse;margin-top:20px;font-size:14px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #1C2026;vertical-align:top}
th{color:var(--mute);font-weight:400;font-size:12px}
td a{color:#fff;text-decoration:none;border-bottom:1px solid #3A414B}
.back{all:unset;pointer-events:auto;cursor:pointer;color:var(--mute);font-size:13px;display:inline-flex;align-items:center;gap:4px;height:32px;margin-bottom:4px}
.back:hover{color:#fff}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:5.5em}.stack td::before{content:attr(data-l);float:inline-start;width:5em;margin-inline-start:-5.5em;color:var(--mute)}}
#viewer{position:fixed;inset:0}
.side{position:absolute;top:52px;left:0;bottom:0;width:var(--sw,380px);display:flex;flex-direction:column;background:#111316;border-right:1px solid #22262c;z-index:2;transition:transform .25s}
body.sideoff .side{transform:translateX(-100%)}
body.resizing,body.resizing *{cursor:col-resize!important;user-select:none}
.steps{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;background:#0b0c0e;border-bottom:1px solid #22262c;z-index:4}
.steps .back{height:auto;margin:0;white-space:nowrap}
.stepper{display:flex;align-items:center;gap:8px;min-width:0}
.st{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 6px;border-radius:18px;background:#1B1F25;color:#E8ECF2;text-decoration:none;font-size:13px;min-width:0}
a.st:hover{background:#262B33}
.st i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600;background:#3A3F47}
.st b{font-weight:600;white-space:nowrap}
.st small{color:#6F7885;font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st.on{background:#E8EAED;color:#0b0d10}.st.on i{background:#0b0d10;color:#fff}.st.on small{color:rgba(0,0,0,.55)}
.sl{flex:none;width:18px;height:1px;background:#3A3F47}
.fbtns{display:grid;grid-template-columns:1fr auto;gap:8px}
.export2{height:46px;padding:0 14px;border:1px solid #3A3F47;border-radius:14px;background:transparent;color:#E8ECF2;font:inherit;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer}
.export2:hover{border-color:#8A94A3}
.export2 svg{width:16px;height:16px}
.handle{display:none}
.shead{padding:16px 22px 12px;border-bottom:1px solid var(--line)}
.srow{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.shead b{display:block;font-weight:600;font-size:19px;letter-spacing:.01em;color:#fff}
.shead span#v-sub{display:block;color:var(--mute);font-size:13px;margin-top:3px}
.shead .chips{border:0;margin:12px 0 0;padding:0}
.sbody{flex:1;overflow:auto;padding:0 22px;scrollbar-width:thin;scrollbar-color:#2A2F36 transparent}
.grp{border-bottom:1px solid var(--line)}
.gh{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;height:48px;cursor:pointer}
.gh span{font-size:14px;font-weight:600;color:#fff;flex:none}
.gh .gs{flex:1;font-size:12px;color:#6F7885;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .15s}
.grp.shut .gs{opacity:1}
.gh svg{width:16px;height:16px;color:#7C8592;flex:none;transition:transform .2s}
.grp.shut .gh svg{transform:rotate(-90deg)}
.gb{padding:0 0 16px}
.grp.shut .gb{display:none}
.gh:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;border-radius:8px}
.gdesc{font-size:11px;color:#7C8592;margin:-2px 0 8px}
.sfoot{padding:12px 22px 18px;border-top:1px solid var(--line);background:#111316}
.sfoot .stat{color:#6F7885;font-size:12px;font-variant-numeric:tabular-nums;margin:4px 0 12px;min-height:16px}
.export{width:100%;height:46px;border:0;border-radius:14px;background:#E8EAED;color:#0b0d10;font:inherit;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.export:hover{background:#fff}
.export svg{width:18px;height:18px}
.grip{position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:3}
.grip::after{content:'';position:absolute;top:0;bottom:0;left:3px;width:2px;background:transparent;transition:background .15s}
.grip:hover::after,.grip:focus-visible::after,body.resizing .grip::after{background:#00C8D2}
.stage{position:absolute;top:52px;right:0;bottom:0;left:var(--sw,380px);transition:left .25s}
body.sideoff .stage{left:0}
body.resizing .side,body.resizing .stage{transition:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#ref{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;opacity:.5;display:none}
.hint{position:absolute;top:18px;left:22px;color:#4F5761;font-size:12px;pointer-events:none}
.sidebtn{position:absolute;top:12px;right:14px;height:34px;padding:0 14px 0 12px;border:1px solid var(--line);border-radius:17px;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#C9D1DC;font:inherit;font-size:12px;display:flex;align-items:center;gap:7px;cursor:pointer}
.sidebtn svg{width:15px;height:15px}
.sidebtn:hover{color:#fff}
.seg2{display:inline-flex;padding:2px;border-radius:10px;background:#22262D}
.seg2 button{height:26px;min-width:40px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:#AEB6C2;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.seg2 button.on{background:#E8EAED;color:#0b0d10}
.htop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.htop .seg2{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{height:30px;padding:0 12px;border:1px solid #2A2F36;border-radius:999px;background:transparent;color:#C9D1DC;font:inherit;font-size:12px;cursor:pointer}
.chips button:hover{border-color:#4A515C}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#0b0d10}
.row{padding:4px 0}
.themes{padding:0}
.themes .pl{display:flex;align-items:baseline;gap:8px;font-size:13px;color:#C9D1DC;margin:0 0 8px}
.themes .pl small{font-size:11px;color:#7C8592}
.sws{display:flex;gap:7px;flex-wrap:nowrap}
.swc{width:28px;height:28px;border-radius:50%;border:1px solid #3A3F47;padding:0;cursor:pointer;position:relative;background:linear-gradient(135deg,var(--a) 0 50%,var(--b) 50% 100%)}
.swc i{position:absolute;left:50%;top:32px;transform:translateX(-50%);font-style:normal;font-size:10px;color:#7C8592;white-space:nowrap}
.swc.on{outline:2px solid #fff;outline-offset:2px}
.swc.on i{color:#fff}
.swc.orig{background:conic-gradient(#5E6A47 0 25%,#A9AECB 0 50%,#CDB55C 0 75%,#1AA6CC 0)}
.sws{padding-bottom:14px}
.cseg button i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:3px;vertical-align:2px}
.cseg button.on i{box-shadow:0 0 0 1px #0b0d10}
.place .crow{margin-top:8px}
.cinfo{font-size:12px;color:#AEB6C2;line-height:1.55;margin-top:8px;display:grid;gap:6px}
.cinfo small{font-size:11px;color:#7C8592}
.cinfo b{font-weight:600}
.place{margin:0}
.place .ph{font-size:13px;font-weight:600;color:#fff;margin-bottom:8px}
.place .pl{display:flex;align-items:baseline;gap:8px;font-size:13px;color:#C9D1DC;margin:4px 0 6px}
.place .pl+.pseg+.pl{margin-top:14px}
.place .pl small{font-size:11px;color:#7C8592}
.pseg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:3px;border-radius:12px;background:#1B1F25}
.pseg button{height:30px;padding:0;border:0;border-radius:9px;background:transparent;color:#C9D1DC;font:inherit;font-size:12px;white-space:nowrap;cursor:pointer}
.pseg button.on{background:#E8EAED;color:#0b0d10}
.pseg button:disabled{color:#4A515C;cursor:not-allowed}
.pbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pbtns button{min-height:44px;padding:6px 4px;border:0;border-radius:12px;background:#22262D;color:#E8EAED;font:inherit;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.pbtns button:disabled{color:#4A515C;cursor:not-allowed}
.pbtns small{font-size:10px;min-height:12px}
.pbtns small.same{color:#EBBE46}.pbtns small.diff{color:#00C8D2}
.ptog{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#C9D1DC;margin-top:10px}
.sw{width:44px;height:26px;border:0;border-radius:13px;background:#3A3F47;position:relative;cursor:pointer}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:#00C8D2}.sw.on::after{left:21px}
@media (prefers-reduced-motion: reduce){.sw::after{transition:none}}
.row label{display:flex;justify-content:space-between;font-size:13px;color:#C9D1DC}
.row output{color:#fff;font-variant-numeric:tabular-nums}
.row.hide{display:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(var(--acc),var(--acc)) 0 0/var(--p,50%) 100% no-repeat,#2A2F36}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-7px;box-shadow:0 1px 4px rgba(0,0,0,.6)}
input[type=range]::-moz-range-track{height:2px;background:#2A2F36}
input[type=range]::-moz-range-progress{height:2px;background:var(--acc)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.dock{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--line);border-radius:999px}
.dock button{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:#C9D1DC;display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s}
.dock button:hover{background:rgba(255,255,255,.08)}
.dock button.on{color:#0b0d10;background:var(--acc)}
.dock svg{width:20px;height:20px}
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,8px);background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:13px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:899px){
 .side{top:auto;left:0;right:0;width:auto;height:var(--sh,50dvh);border-right:0;border-top:1px solid #22262c;border-radius:20px 20px 0 0;transition:height .25s}
 .side[data-snap=peek]{--sh:150px}.side[data-snap=half]{--sh:50dvh}.side[data-snap=full]{--sh:88dvh}
 .side[data-snap=peek] .sbody,.side[data-snap=peek] .sfoot #foot-t,.side[data-snap=peek] .sfoot .stat{display:none}
 .handle{display:flex;justify-content:center;align-items:center;height:22px;cursor:grab;touch-action:none;flex:none}
 .handle i{width:40px;height:5px;border-radius:3px;background:#3A3F47}
 .shead{padding:2px 18px 10px}.sbody{padding:0 18px}.sfoot{padding:10px 18px 14px}
 .grip,.sidebtn,.hint{display:none}
 .st small,.steps .back span{display:none} .st{padding:0 10px 0 6px} .steps{padding:0 10px}
 body.sideoff .side{transform:none}
 .stage{left:0;bottom:var(--stb,50dvh);transition:bottom .25s}
 #viewer:has(.side[data-snap=peek]) .stage{--stb:150px}
 #viewer:has(.side[data-snap=full]) .stage{--stb:50dvh}
 .dock{bottom:12px}
 .toast{bottom:auto;top:16px}
}
@media(prefers-reduced-motion:reduce){.toast,.panel>button svg{transition:none}}
</style>
</head>
<body>
<main id="home">
  <header class="hero"><div class="htop"><h1 data-i18n="极小曲面目录">极小曲面目录</h1><div class="lang seg2" role="group" data-i18n-aria="语言"><button type="button" data-l="zh">中</button><button type="button" data-l="en">EN</button></div></div><p id="count"></p></header>
  <div class="bar">
    <div class="tags" id="tags" data-i18n-aria="建筑用途"></div>
    <div class="seg" role="tablist"><button type="button" data-v="cards" class="on" data-i18n="卡片">卡片</button><button type="button" data-v="list" data-i18n="清单">清单</button></div>
  </div>
  <div id="cards"></div>
  <div id="list" hidden></div>
</main>
<div id="viewer">
  <nav class="steps" id="steps">
    <button type="button" class="back" id="back">‹ <span data-i18n="目录">目录</span></button>
    <div class="stepper">
      <span class="st on"><i>1</i><b data-i18n="单体">单体</b><small id="st1s"></small></span>
      <span class="sl"></span>
      <a class="st" id="st2" href="../unit-tower/"><i>2</i><b data-i18n="塔楼">塔楼</b></a>
      <span class="sl"></span>
      <a class="st" id="st3" href="../unit-tower/#print"><i>3</i><b data-i18n="打印">打印</b></a>
    </div>
    <div class="lang seg2" role="group" data-i18n-aria="语言"><button type="button" data-l="zh">中</button><button type="button" data-l="en">EN</button></div>
  </nav>
  <aside class="side" id="side" data-i18n-aria="控制面板">
    <div class="handle" id="handle" role="button" tabindex="0" data-i18n-aria="展开"><i></i></div>
    <div class="shead">
      <b id="v-name"></b><span id="v-sub"></span>
      <div class="chips" id="chips"></div>
    </div>
    <div class="sbody" id="rows"></div>
    <div class="sfoot">
      <div id="foot-t"></div>
      <div class="stat" id="stat"></div>
      <div class="fbtns"><button type="button" class="export" id="b-tower"><span data-i18n="用作塔楼单体 →">用作塔楼单体 →</span></button>
      <button type="button" class="export2" id="b-stl" data-i18n-title="导出 STL"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19h14"/></svg><span>STL</span></button></div>
    </div>
    <div class="grip" id="grip" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-title="拖动调整侧栏宽度"></div>
  </aside>
  <section class="stage" id="stage">
    <canvas id="c" tabindex="0"></canvas>
    <img id="ref" alt="">
    <div class="hint" data-i18n="拖动旋转 · 滚轮缩放 · 双击回到原图视角">拖动旋转 · 滚轮缩放 · 双击回到原图视角</div>
    <button type="button" class="sidebtn" id="b-side" aria-expanded="true" aria-controls="side"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6 3v10"/></svg><span>收起侧栏</span></button>
    <nav class="dock" data-i18n-aria="工具">
      <button type="button" id="b-reset" data-i18n-title="回到原图视角">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
      </button>
      <button type="button" id="b-wire" class="on" aria-pressed="true" data-i18n-title="参数网格线">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16"/></svg>
      </button>
      <button type="button" id="b-ref" aria-pressed="false" data-i18n-title="叠加参考图">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="3"/><circle cx="9.5" cy="10" r="1.6"/><path d="M5 17l4.5-4.5 3 3 2.5-2.5 4 4"/></svg>
      </button>
    </nav>
  </section>
  <input type="file" id="file" accept="image/*" hidden>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
{
const $ = s => document.querySelector(s);
const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT;
function toast(msg, o){
  const t = $('#toast'); t.textContent = T(msg, o); t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800);

   001 · Scherk–Enneper（M. Weber, "Singly Periodic Scherk Surface with Enneper Ends"）
   G(z)  = c z^{k-1}(z^{2k}−a^{2k})/(z^{2k}−a^{−2k}),  c = (1−a^{−2k})/(1−a^{2k})

function clipPlanes(P, I, Ln, planes){

    const f = v => nx*P[v*3] + ny*P[v*3+1] + nz*P[v*3+2] - d;
    const NI = [], cache = new Map();
    const cut = (a, b) => { const key = a<b ? a*4294967296+b : b*4294967296+a; if (cache.has(key)) return cache.get(key);
      const fa=f(a), fb=f(b), t=fa/(fa-fb), id=P.length/3; for (let k=0;k<3;k++) P.push(P[a*3+k]+t*(P[b*3+k]-P[a*3+k])); cache.set(key, id); return id; };
    for (let q=0; q<I.length; q+=3){
      const v=[I[q],I[q+1],I[q+2]], inn=v.map(x=>f(x)<=0), n=inn.filter(Boolean).length;
      if (n===3){ NI.push(...v); continue; } if (n===0) continue;
      const s0 = n===1 ? inn.indexOf(true) : inn.indexOf(false);
      const a=v[s0], b=v[(s0+1)%3], c=v[(s0+2)%3], ab=cut(a,b), ac=cut(a,c);
      if (n===1) NI.push(a, ab, ac); else NI.push(ab, b, c, ab, c, ac);
    }
    const NL = []; for (let q=0; q<Ln.length; q+=2){ if (f(Ln[q])<=1e-9 && f(Ln[q+1])<=1e-9) NL.push(Ln[q], Ln[q+1]); }
    I = NI; Ln = NL;
  }

  const map = v => { if (used[v] < 0){ used[v] = k++; Q.push(P[v*3],P[v*3+1],P[v*3+2]); } return used[v]; };
  I = I.map(map); Ln = Ln.map(map);
  return [Q, I, Ln];
}

/* =====================================================================
   005 · Scherk 双周期曲面（M. Weber: Doubly Scherk (g=0).nb）
   G = √((1+z)/(z−1))，dh = dz/z；原文给出的闭式原函数：
   f(z) = (−2 Re arctan(√(z−1)/√(z+1)), −2 Im arcsinh(√(z−1)/√2), Re log z)
   上半圆盘 → 绕单位圆像（直线）旋转 → 关于 x=0、y=0 镜像 → 2π 平移。
   原作 PoV-Ray 场景取 e^z cos y = cos x 的形式（即交换 x、y），窗口 |x|,|y| ≤ 1.5π，|z| ≤ 2。
   ===================================================================== */
function scherkPatch(h, nx, ny){
  const xmin = Math.exp(-h), eps = 1e-9, nu = nx+1, nv = ny+1, pos = new Float64Array(nu*nv*3);
  for (let i=0; i<nu; i++){

    for (let j=0; j<nv; j++){
      const t = eps + (Math.PI-2*eps)*j/ny, z = [r*Math.cos(t), r*Math.sin(t)];
      const q = cx.sqrt([z[0]-1, z[1]]);
      const x = -2*cx.atan(cx.div(q, cx.sqrt([z[0]+1, z[1]])))[0];
      const y = -2*cx.asinh([q[0]/Math.SQRT2, q[1]/Math.SQRT2])[1];
      const o = (i*nv+j)*3; pos[o] = x; pos[o+1] = y; pos[o+2] = Math.log(r);
    }
  }
  return {pos, nu, nv};
}
function scherkBuild(P){
  const pt = scherkPatch(P.h, 30, 30), g = i => [pt.pos[i*3], pt.pos[i*3+1], pt.pos[i*3+2]];
  const a0 = g((pt.nu-1)*pt.nv), a1 = g((pt.nu-1)*pt.nv + pt.nv-1);
  let ts = [{m:I3, o:[0,0,0], f:false}];
  ts = closeT(ts, rotLine(a0, [a1[0]-a0[0], a1[1]-a0[1], a1[2]-a0[2]]));
  ts = closeT(ts, reflPlane([1,0,0], 0)); ts = closeT(ts, reflPlane([0,1,0], 0));
  const half = P.w*Math.PI/2, n = Math.ceil(half/(2*Math.PI) + 0.5), all = [];
  const SW = {m:[0,1,0, 1,0,0, 0,0,1], o:[0,0,0], f:true};   // 交换 x、y，与原作 PoV 场景一致
  for (let i=-n; i<=n; i++) for (let j=-n; j<=n; j++) ts.forEach(t => all.push(comp(SW, comp({m:I3, o:[2*Math.PI*i, 2*Math.PI*j, 0], f:false}, t))));
  return assemble(pt.pos, pt.nu, pt.nv, all, 5, 5, [[-half,-half,-P.h-1],[half,half,P.h+1]]);
}

/* =====================================================================
   006 · Karcher–Meeks–Rosenberg（M. Weber: KMR-1.nb，Case 1）
   原文件只存了图形；Weierstrass 数据按 KMR-2.nb 的写法换成 Case 1：
   G = √((z−a)(z−1/a)/((z+a)(z+1/a)))，dh = dz/z，f(w) = Re∫ᵢʷ ω − f(a)
   第一象限 r∈[r0,1] → 绕虚轴像、单位圆像（两条直线）旋转 → 关于 x=0、y=0 镜像
   → 平移 (4·f(i)ₓ, 0, 0)、(0, 2π, 0)。已与原作 PoV 网格逐点核对（a=0.1，偏差 ≤ 1.2e−4）。
   ===================================================================== */
function kmrForm(z, a){

  const s1 = cx.sub(Gi, G), s2 = cx.add(Gi, G);
  return [cx.mul([s1[0]/2, s1[1]/2], dh), cx.mul([-s2[1]/2, s2[0]/2], dh), dh];
}
function kmrF(w, a){
  const d = [w[0], w[1]-1], acc = [0,0,0];
  for (let k=0; k<TS.X.length; k++){
    const s = TS.X[k], z = [d[0]*s, 1+d[1]*s], F = kmrForm(z, a);
    for (let c=0; c<3; c++) acc[c] += (F[c][0]*d[0] - F[c][1]*d[1]) * TS.W[k];

}
function kmrBuild(P){
  const a = P.a, r0 = P.r0, nx = 30, ny = 18, eps = 1e-6;
  const xs = []; for (let i=0; i<=nx; i++) xs.push(Math.log(r0) + (Math.log(a)-Math.log(r0))*i/nx);
  for (let i=1; i<=nx; i++) xs.push(Math.log(a) + (0-Math.log(a))*i/nx);
  const nu = xs.length, nv = ny+1, pos = new Float64Array(nu*nv*3), fa = kmrF([a,0], a);
  for (let i=0; i<nu; i++) for (let j=0; j<nv; j++){
    const t = eps + (Math.PI/2-2*eps)*j/ny, r = Math.exp(xs[i]), f = kmrF([r*Math.cos(t), r*Math.sin(t)], a), o = (i*nv+j)*3;
    pos[o] = f[0]-fa[0]; pos[o+1] = f[1]-fa[1]; pos[o+2] = f[2]-fa[2];
  }
  const g = (i, j) => { const o = (i*nv+j)*3; return [pos[o], pos[o+1], pos[o+2]]; };
  const p0 = g(0, ny), p1 = g(nu-1, ny), p2 = g(nu-1, 0);
  let ts = [{m:I3, o:[0,0,0], f:false}];
  ts = closeT(ts, rotLine(p0, [p1[0]-p0[0], p1[1]-p0[1], p1[2]-p0[2]]));
  ts = closeT(ts, rotLine(p1, [p2[0]-p1[0], p2[1]-p1[1], p2[2]-p1[2]]));
  ts = closeT(ts, reflPlane([1,0,0], 0)); ts = closeT(ts, reflPlane([0,1,0], 0));
  const dx = 4*p1[0], dy = 2*Math.PI, all = [];
  for (let i=0; i<P.n; i++) for (let j=0; j<P.n; j++) ts.forEach(t => all.push(comp({m:I3, o:[i*dx, j*dy, 0], f:false}, t)));
  return assemble(pos, nu, nv, all, 10, 6, null);
}

  });
  if (!cf.length) info.push(`<small>${T(cur.cneed ? '这个曲面没有平整截断面：选「右」会先截平再镜像' : '点 1–2 个面（不同方向）；圆点颜色 = 接缝质量')}</small>`);

  }
}

   spec:[['k','端数 2k',1,8,1, v => String(2*v)], ['a','摆动 a',0.5,0.999,0.001, v => v.toFixed(3)], ['r','截取半径',0.3,7,0.05, v => v.toFixed(2)], ['n','周期数',1,6,1, v => String(v)]],

   build(P){
     const {k, a, r, n} = P, pt = sePatch(k, a, r), topo = gridTopo(pt.nu, pt.nv, 4, 2), h = pt.h;
     let ts = [{m:I3, o:[0,0,0], f:false}];
     ts = ts.concat(ts.map(t => comp({m:[-1,0,0, 0,1,0, 0,0,-1], o:[0,0,0], f:true}, t)));
     const th = Math.PI/2/k, nx = Math.cos(th), ny = Math.sin(th);
     ts = ts.concat(ts.map(t => comp({m:[1-2*nx*nx, -2*nx*ny, 0, -2*nx*ny, 1-2*ny*ny, 0, 0,0,1], o:[0,0,0], f:true}, t)));
     let rot = []; for (let i=0; i<k; i++) rot = rot.concat(ts.map(t => comp(rotZ(2*Math.PI*i/k, 0), t))); ts = rot;
     ts = ts.concat(ts.map(t => comp({m:[1,0,0, 0,1,0, 0,0,-1], o:[0,0,2*h], f:true}, t)));
     let tr = []; for (let m=0; m<n; m++) tr = tr.concat(ts.map(t => comp({m:I3, o:[0,0,m*4*h], f:false}, t)));
     tr = tr.map(t => comp({m:[1,0,0, 0,1,0, 0,0,-1], o:[0,0,0], f:true}, t));
     const out = emit(pt.pos, pt.nu*pt.nv, topo, tr); out.h = h; return out;
   }},

   }},

/* ---------- 目录首页 ---------- */
const SHOW_TAGS = false;
let tagOn = null, view = 'cards';
function renderHome(){
  const list = SURFACES.filter(x => !tagOn || x.tags.includes(tagOn));
  $('#count').textContent = T('按周期性与端的类型分类 · 已收录 {n} 个曲面', {n:SURFACES.length});
  // 用途标签先不显示（数据保留在 SURFACES.tags，之后要用再打开）
  if (SHOW_TAGS) $('#tags').innerHTML = ['全部', ...TAGS].map(t => `<button type="button" data-t="${esc(t)}" class="${(t==='全部'?!tagOn:tagOn===t)?'on':''}">${esc(T(t))}</button>`).join('');
  $('#cards').innerHTML = CATS.map(c => {
    const items = list.filter(x => x.cat === c.id);
    return `<section class="cat"><h2>${c.id} · ${esc(T(c.name))} <small>${esc(T(c.desc))} · ${items.length}</small></h2>
      <div class="grid">${items.length ? items.map(x => `<button type="button" class="card" data-id="${x.id}">
        <img src="${x.thumb}" alt="${esc(T('{name} 预览', {name:T(x.name)}))}">
        <div class="meta"><div class="no">${c.id} · ${esc(T(x.sub || ENDS[x.end] || ''))} · ${x.no}</div><div class="nm">${esc(T(x.name))}</div>
        <div class="sub">${esc(T(x.zh))}</div>${SHOW_TAGS ? x.tags.map(t => `<span class="pill">${esc(T(t))}</span>`).join('') : ''}</div></button>`).join('')
        : `<div class="empty">${T('待收录')}</div>`}</div></section>`;

  updateGroups();
}
function refView(){
  if (povView()){

    const tgt = mv(QT, [0, -ty, 0]), eye = mv(QT, [0, 0, d]);

    camera.near = d/100; camera.far = d*20; camera.updateProjectionMatrix(); controls.update(); return;
  }

function setTitle(){ if (!S) return; const st = $('#st1s'); if (st) st.textContent = S.no + ' · ' + T(S.name); $('#v-name').textContent = S.no + ' · ' + T(S.name); $('#v-sub').textContent = T(S.zh); $('#c').setAttribute('aria-label', T('{name} 极小曲面三维预览，拖动旋转，滚轮缩放', {name:T(S.name)})); }

// ---------- STL（带厚度的闭合壳体）+ ZIP ----------
// 合并重合顶点、求顶点法向（导出和加厚预览共用）
function baseFrom(src, idx){
  const nV = src.length/3;
  // 数值哈希合并重合顶点（比字符串键快数倍）
  const map = new Map(), remap = new Uint32Array(nV), K = new Int32Array(nV*3), Pp = [], q = 1e5;
  for (let v=0; v<nV; v++){
    const a = Math.round(src[v*3]*q), b = Math.round(src[v*3+1]*q), c = Math.round(src[v*3+2]*q);
    const h = ((a*73856093) ^ (b*19349663) ^ (c*83492791)) | 0;
    let lst = map.get(h), id = -1;
    if (lst) for (const u of lst){ if (K[u*3]===a && K[u*3+1]===b && K[u*3+2]===c){ id = u; break; } }
    if (id < 0){ id = Pp.length/3; K[id*3]=a; K[id*3+1]=b; K[id*3+2]=c; Pp.push(src[v*3], src[v*3+1], src[v*3+2]); if (lst) lst.push(id); else map.set(h, [id]); }
    remap[v] = id;
  }
  const T = [];
  for (let i=0; i<idx.length; i+=3){ const a = remap[idx[i]], b = remap[idx[i+1]], c = remap[idx[i+2]]; if (a!==b && b!==c && a!==c) T.push(a,b,c); }
  const n = Pp.length/3, N = new Float64Array(n*3);
  for (let i=0; i<T.length; i+=3){
    const a = T[i]*3, b = T[i+1]*3, c = T[i+2]*3;
    const ux = Pp[b]-Pp[a], uy = Pp[b+1]-Pp[a+1], uz = Pp[b+2]-Pp[a+2], vx = Pp[c]-Pp[a], vy = Pp[c+1]-Pp[a+1], vz = Pp[c+2]-Pp[a+2];
    const nx = uy*vz-uz*vy, ny = uz*vx-ux*vz, nz = ux*vy-uy*vx;
    for (const p of [a,b,c]){ N[p]+=nx; N[p+1]+=ny; N[p+2]+=nz; }
  }
  for (let v=0; v<n; v++){ const l = Math.hypot(N[v*3], N[v*3+1], N[v*3+2]) || 1; N[v*3]/=l; N[v*3+1]/=l; N[v*3+2]/=l; }
  const E = new Map();
  for (let i=0; i<T.length; i+=3) for (let e=0; e<3; e++){
    const a = T[i+e], b = T[i+(e+1)%3], key = a<b ? a*n+b : b*n+a;
    const r = E.get(key); if (r) r.c++; else E.set(key, {a, b, c:1});
  }
  const B = []; for (const {a, b, c} of E.values()) if (c === 1) B.push(a, b);
  return {Pp, T, N, n, remap, B};
}
// 摆放后的几何基底：在原始基底上做同样的旋转 / 镜像 / 平移（避免重复合并顶点）
function offsetBase(){
  if (cur._base) return cur._base;
  const rb = cur._rawBase || (cur._rawBase = baseFrom(cur.raw, cur.rawIdx)), M = cur.M, c = cur.pc, n = rb.n;
  const Pp = new Array(n*3), N = new Float64Array(n*3);
  for (let v=0; v<n; v++){
    const p = mv(M, [rb.Pp[v*3], rb.Pp[v*3+1], rb.Pp[v*3+2]]), q = mv(M, [rb.N[v*3], rb.N[v*3+1], rb.N[v*3+2]]);
    for (let k=0; k<3; k++){ Pp[v*3+k] = p[k] - c[k]; N[v*3+k] = q[k]; }
  }
  let T = rb.T; if (cur.det < 0){ T = T.slice(); for (let i=0; i<T.length; i+=3){ const t = T[i+1]; T[i+1] = T[i+2]; T[i+2] = t; } }
  return (cur._base = {Pp, T, N, n, remap: rb.remap, B: rb.B});
}
function offsetPos(half){
  const {Pp, N, n} = offsetBase(), O = new Float32Array(n*6);
  for (let v=0; v<n; v++) for (let c=0; c<3; c++){ const d = N[v*3+c]*half; O[v*3+c] = Pp[v*3+c]+d; O[n*3+v*3+c] = Pp[v*3+c]-d; }
  return O;
}
function shell(){
  const {Pp, T, n, B} = offsetBase(), half = P.t/MM/2;
  if (half <= 0) return {P:Pp, T};
  const O = offsetPos(half), Sx = [];
  for (let i=0; i<T.length; i+=3){ Sx.push(T[i], T[i+1], T[i+2]); Sx.push(T[i]+n, T[i+2]+n, T[i+1]+n); }
  for (let i=0; i<B.length; i+=2){ const a = B[i], b = B[i+1]; Sx.push(a, b, b+n, a, b+n, a+n); }
  return {P:O, T:Sx};
}
// 加厚预览：上下两层都保持原朝向（这样两侧颜色和中面一致），侧边单独着色
function thickDisp(){
  const {T, n, remap, B} = offsetBase(), O = offsetPos(P.t/MM/2);
  const idx = new Uint32Array(T.length*2); idx.set(T); for (let i=0; i<T.length; i++) idx[T.length+i] = T[i]+n;
  const rim = new Uint32Array(B.length*3);
  for (let i=0, k=0; i<B.length; i+=2){ const a = B[i], b = B[i+1]; rim.set([a, b, b+n, a, b+n, a+n], k); k += 6; }
  const L = cur.lin, lin = new Uint32Array(L.length*2);
  for (let i=0; i<L.length; i++){ lin[i] = remap[L[i]]; lin[L.length+i] = remap[L[i]]+n; }
  return {pos:O, idx, rim, lin};
}
function stl(){
  let {P:Q, T} = shell();
  const nT = T.length/3;
  const buf = new ArrayBuffer(84 + 50*nT), dv = new DataView(buf);
  const head = (S.name + ' (M. Weber), mm, Z up').replace(/[^\x20-\x7e]/g, '-').slice(0, 80);
  for (let i=0; i<head.length; i++) dv.setUint8(i, head.charCodeAt(i));
  dv.setUint32(80, nT, true);
  let ymin = Infinity; for (let i=1; i<Q.length; i+=3) if (Q[i] < ymin) ymin = Q[i];
  const p = v => [Q[v*3]*MM, -Q[v*3+2]*MM, (Q[v*3+1]-ymin)*MM];
  let o = 84;
  for (let k=0; k<nT; k++){
    const a = p(T[k*3]), b = p(T[k*3+1]), c = p(T[k*3+2]);
    const ux = b[0]-a[0], uy = b[1]-a[1], uz = b[2]-a[2], vx = c[0]-a[0], vy = c[1]-a[1], vz = c[2]-a[2];
    const nx = uy*vz-uz*vy, ny = uz*vx-ux*vz, nz = ux*vy-uy*vx, ln = Math.hypot(nx, ny, nz) || 1;
    for (const f of [nx/ln, ny/ln, nz/ln, ...a, ...b, ...c]){ dv.setFloat32(o, f, true); o += 4; }
    dv.setUint16(o, 0, true); o += 2;
  }
  return new Uint8Array(buf);
}
// 单体 → 塔楼：开放中面（按当前摆放 / 组合），Z 朝上，一个单体 = 一层 3.6 m
function unitSTL(){
  const {Pp, T} = offsetBase(), n = Pp.length/3;
  const lo = [Infinity,Infinity,Infinity], hi = [-Infinity,-Infinity,-Infinity], Q = new Float64Array(n*3);
  for (let v=0; v<n; v++){ const p = [Pp[v*3], -Pp[v*3+2], Pp[v*3+1]]; for (let k=0; k<3; k++){ Q[v*3+k] = p[k]; if (p[k] < lo[k]) lo[k] = p[k]; if (p[k] > hi[k]) hi[k] = p[k]; } }
  const s = 3.6/((hi[2]-lo[2]) || 1), cx = (lo[0]+hi[0])/2, cy = (lo[1]+hi[1])/2;
  const nT = T.length/3, buf = new ArrayBuffer(84 + 50*nT), dv = new DataView(buf);
  const head = (S.no + ' ' + S.name + ' unit, m, Z up').replace(/[^\x20-\x7e]/g, '-').slice(0, 80);
  for (let i=0; i<head.length; i++) dv.setUint8(i, head.charCodeAt(i));
  dv.setUint32(80, nT, true);
  const p = v => [(Q[v*3]-cx)*s, (Q[v*3+1]-cy)*s, (Q[v*3+2]-lo[2])*s];
  let o = 84;
  for (let k=0; k<nT; k++){
    const a = p(T[k*3]), b = p(T[k*3+1]), c = p(T[k*3+2]);
    const ux = b[0]-a[0], uy = b[1]-a[1], uz = b[2]-a[2], vx = c[0]-a[0], vy = c[1]-a[1], vz = c[2]-a[2];
    const nx = uy*vz-uz*vy, ny = uz*vx-ux*vz, nz = ux*vy-uy*vx, ln = Math.hypot(nx, ny, nz) || 1;
    for (const f of [nx/ln, ny/ln, nz/ln, ...a, ...b, ...c]){ dv.setFloat32(o, f, true); o += 4; }
    dv.setUint16(o, 0, true); o += 2;
  }
  return buf;
}
function unitThumb(){
  try {
    renderer.render(scene, camera);
    const src = renderer.domElement, c = document.createElement('canvas'), z = 240; c.width = c.height = z;
    const g = c.getContext('2d'), m = Math.min(src.width, src.height);
    g.fillStyle = '#000'; g.fillRect(0, 0, z, z);
    g.drawImage(src, (src.width-m)/2, (src.height-m)/2, m, m, 0, 0, z, z);
    return c.toDataURL('image/jpeg', 0.82);
  } catch (e){ return ''; }
}
async function sendToTower(){
  if (!cur) return;
  const buf = unitSTL();
  const slug = (S.name + '').normalize('NFKD').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'unit';
  const name = `${S.no}-${slug}-${S.spec.map(([k]) => k + (+P[k]).toFixed(k === 'ori' ? 0 : 2).replace(/\.?0+$/, '')).join('-')}.stl`;
  if (!ON_PAGES){
    const url = URL.createObjectURL(new Blob([buf], {type:'model/stl'})), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('这里不能直接跳转：已下载单体 STL（1 层 = 3.6 m），拖进塔楼生成器即可'); return;
  }
  const params = S.spec.filter(([k]) => k !== 'ori').map(([k, lab,,,,f]) => [lab, EN[lab] || lab, f(+P[k])]);
  if (P.fl > 0) params.push(['竖向叠加', 'Vertical stacking', String(P.fl)]);
  if (cur.cmult) params.push(['组合', 'Mirror array', '×' + cur.cmult]);
  const meta = {src:'catalogue', id:S.id, no:S.no, name_zh:S.no + ' · ' + S.name, name_en:S.no + ' · ' + (EN[S.name] || S.name), params, thumb:unitThumb(), fresh:true};
  try { await idbPutUnit({name, buf, at:Date.now(), meta}); }
  catch (e){ toast('保存单体失败，请重试'); return; }
  toast('单体已存好，正在打开塔楼生成器…');
  setTimeout(() => { location.href = TOWER_URL; }, 350);
}
$('#b-tower').addEventListener('click', sendToTower);
const CRC = (() => { const t = new Uint32Array(256); for (let n=0; n<256; n++){ let c = n; for (let k=0; k<8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i=0; i<u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function put(dv, list){ list.forEach(([o,v,s]) => s === 4 ? dv.setUint32(o, v, true) : dv.setUint16(o, v, true)); }
function zip(name, data){
  const nm = new TextEncoder().encode(name), crc = crc32(data), sz = data.length;
  const lh = new DataView(new ArrayBuffer(30));
  put(lh, [[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,0,2],[10,0,2],[12,0x21,2],[14,crc,4],[18,sz,4],[22,sz,4],[26,nm.length,2],[28,0,2]]);
  const cd = new DataView(new ArrayBuffer(46));
  put(cd, [[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[10,0,2],[12,0,2],[14,0x21,2],[16,crc,4],[20,sz,4],[24,sz,4],[28,nm.length,2],[30,0,2],[32,0,2],[34,0,2],[36,0,2],[38,0,4],[42,0,4]]);
  const cdOff = 30 + nm.length + sz, cdSize = 46 + nm.length;
  const end = new DataView(new ArrayBuffer(22));
  put(end, [[0,0x06054b50,4],[4,0,2],[6,0,2],[8,1,2],[10,1,2],[12,cdSize,4],[16,cdOff,4],[20,0,2]]);
  return new Blob([lh.buffer, nm, data, cd.buffer, nm, end.buffer]);
}
let dl = null;
if (window.claude && claude.use) claude.use('downloads').then(d => { dl = d; }).catch(() => {});
$('#b-stl').addEventListener('click', async () => {
  if (!cur) return;
  const tag = S.no + "-" + S.spec.map(([k]) => k + P[k]).join("-") + (P.fl > 0 ? `-${P.fl}F` : "") + `-t${P.t}mm`;
  if (!dl){   // 不在 claude.ai 里（例如 GitHub Pages）：用浏览器普通下载，直接存 .stl
    try {
      const url = URL.createObjectURL(new Blob([stl()], {type:'model/stl'})), a = document.createElement('a');
      a.href = url; a.download = `minimal-surface-${tag}.stl`; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000); toast('已导出 STL');
    } catch (e){ toast('这个视图不能下载，请在浏览器里直接打开本页'); }
    return;
  }
  try {
    await dl.save({filename:`minimal-surface-${tag}.zip`, data:zip(`minimal-surface-${tag}.stl`, stl())});
    toast('已导出 STL（zip 压缩包内）');
  } catch (e){
    const c = e && e.code;
    toast(c === 'declined' ? '已取消导出' : c === 'rate_limited' ? '稍等片刻再试' : c === 'host_unavailable' ? '请在浏览器或电脑上打开本页导出' : '导出失败，请重试');
  }
});
